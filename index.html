  const byMonth = new Map();
  for (const e of state.ecritures) {
    const k = e.date.slice(0, 7);
    if (!byMonth.has(k)) byMonth.set(k, { R: 0, D: 0 });
    byMonth.get(k)[e.sens] += e.montant;
  }
  const keys = [...byMonth.keys()].sort().slice(-12);
  const data = keys.map(k => ({ k, ...byMonth.get(k) }));
  const max = Math.max(...data.map(d => Math.max(d.R, d.D)), 1);
  const W = 640, H = 220, padL = 46, padB = 26, padT = 12, padR = 6;
  const iw = W - padL - padR, ih = H - padT - padB;
  const gw = iw / data.length;
  const bw = Math.min(14, gw / 2 - 3);
  const y = v => padT + ih - (v / max) * ih;
  const moisFr = k => new Date(k + '-15T12:00:00').toLocaleDateString('fr-FR', { month: 'short' });
  let gridY = '';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = (max / steps) * i, yy = y(v);
    gridY += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="1"/>
      <text x="${padL - 6}" y="${yy + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-variant-numeric="tabular-nums">${Math.round(v / 100) / 10} k€</text>`;
  }
  let bars = '';
  data.forEach((d, i) => {
    const cx = padL + gw * i + gw / 2;
    bars += `<g class="mgroup" data-i="${i}">
      <rect x="${cx - bw - 1}" y="${y(d.R)}" width="${bw}" height="${Math.max(ih + padT - y(d.R), 0)}" rx="3" fill="var(--chart-s1)"/>
      <rect x="${cx + 1}" y="${y(d.D)}" width="${bw}" height="${Math.max(ih + padT - y(d.D), 0)}" rx="3" fill="var(--chart-s2)"/>
      <rect class="hit" x="${padL + gw * i}" y="${padT}" width="${gw}" height="${ih}" fill="transparent"
        data-tip="<strong>${moisFr(d.k)} ${d.k.slice(0,4)}</strong><br>Recettes : ${eur(d.R)}<br>Dépenses : ${eur(d.D)}"/>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${moisFr(d.k)}</text>
    </g>`;
  });
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Recettes et dépenses mensuelles">
      ${gridY}
      <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--chart-axis)" stroke-width="1"/>
      ${bars}
    </svg>
    <div class="legend"><span><span class="sw" style="background:var(--chart-s1)"></span>Recettes</span>
    <span><span class="sw" style="background:var(--chart-s2)"></span>Dépenses</span></div>`;
}

function chartSolde(id) {
  // Ligne d'évolution du solde sur 12 mois
  const byMonth = new Map();
  for (const e of [...state.ecritures].sort((a, b) => a.date.localeCompare(b.date))) {
    const k = e.date.slice(0, 7);
    byMonth.set(k, (byMonth.get(k) || 0) + (e.sens === 'R' ? e.montant : -e.montant));
  }
  const keys = [...byMonth.keys()].sort().slice(-12);
  let cum = state.soldeInitial;
  const pts = keys.map(k => { cum += byMonth.get(k); return { k, v: cum }; });
  const min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v));
  const lo = Math.max(0, min - (max - min) * 0.15), hi = max + (max - min) * 0.1 || max + 100;
  const W = 640, H = 200, padL = 48, padB = 24, padT = 10, padR = 10;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = i => padL + (i / (pts.length - 1)) * iw;
  const y = v => padT + ih - ((v - lo) / (hi - lo)) * ih;
  const moisFr = k => new Date(k + '-15T12:00:00').toLocaleDateString('fr-FR', { month: 'short' });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = line + ` L${x(pts.length - 1).toFixed(1)},${padT + ih} L${x(0).toFixed(1)},${padT + ih} Z`;
  let gridY = '';
  for (let i = 0; i <= 3; i++) {
    const v = lo + ((hi - lo) / 3) * i, yy = y(v);
    gridY += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="var(--chart-grid)" stroke-width="1"/>
      <text x="${padL - 6}" y="${yy + 3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)">${(v / 1000).toFixed(1)} k€</text>`;
  }
  const last = pts[pts.length - 1];
  let hits = '';
  pts.forEach((p, i) => {
    hits += `<rect class="hit" x="${x(i) - iw / pts.length / 2}" y="${padT}" width="${iw / pts.length}" height="${ih}" fill="transparent"
      data-tip="<strong>${moisFr(p.k)} ${p.k.slice(0,4)}</strong><br>Solde : ${eur(Math.round(p.v))}"/>`;
    if (i % 2 === 0) hits += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${moisFr(p.k)}</text>`;
  });
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Évolution du solde de trésorerie">
    ${gridY}
    <path d="${area}" fill="var(--chart-s1)" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="var(--chart-s1)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last.v)}" r="4" fill="var(--chart-s1)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(pts.length - 1) - 6}" y="${y(last.v) - 10}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${eur(Math.round(last.v))}</text>
    ${hits}
  </svg>`;
}

function hbars(rows, colorVar='--chart-s1') {
  const max = Math.max(...rows.map(r => r.v), 1);
  return rows.map(r => `<div class="hbar-row">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.label)}">${esc(r.label)}</span>
    <div class="hbar-track"><div class="hbar-fill" style="width:${(r.v / max * 100).toFixed(1)}%;background:var(${colorVar})"></div></div>
    <span class="hbar-val">${r.fmt || eur(r.v)}</span>
  </div>`).join('');
}

function bindChartTips(scope) {
  $$('svg .hit', scope).forEach(h => {
    h.addEventListener('mousemove', e => showTip(h.dataset.tip, e.clientX, e.clientY));
    h.addEventListener('mouseleave', hideTip);
  });
}

/* ================= MODULE : TABLEAU DE BORD ================= */

function viewDashboard() {
  const solde = soldeCourant();
  const { sousSeuil, perimes } = alertesStock();
  const imp = impayes();
  const certs = certsProblemes();
  const prochaine = state.reunions.filter(r => r.statut !== 'terminee').sort((a,b) => a.date.localeCompare(b.date))[0];
  const attenteFFR = state.licencies.filter(l => l.licStatut === 'attente').length;
  const resteACollecter = imp.reduce((s, l) => s + (l.cot - l.cotPaye), 0);
  const parCat = CATEGORIES.map(c => ({ label: c.label.replace(/ – .*/, ' ' + (c.label.split('– ')[1] || '')), v: state.licencies.filter(l => l.cat === c.code).length, fmt: String(state.licencies.filter(l => l.cat === c.code).length) }));

  const alertes = [];
  for (const l of certs.filter(l => daysUntil(l.certFin) < 0).slice(0, 3))
    alertes.push({ badge: '<span class="badge b-crit"><span class="dot"></span>Certificat</span>', txt: `${l.prenom} ${l.nom} — certificat médical expiré`, go: 'licencies' });
  if (sousSeuil.length) alertes.push({ badge: '<span class="badge b-serious"><span class="dot"></span>Stock</span>', txt: `${sousSeuil.length} article(s) sous le seuil d'alerte`, go: 'stock' });
  for (const a of perimes.slice(0, 2))
    alertes.push({ badge: '<span class="badge b-warn"><span class="dot"></span>Péremption</span>', txt: `${a.nom} — ${daysUntil(a.peremption) < 0 ? 'périmé' : 'périme le ' + dfrShort(a.peremption)}`, go: 'stock' });
  if (imp.length) alertes.push({ badge: '<span class="badge b-warn"><span class="dot"></span>Cotisations</span>', txt: `${imp.length} cotisation(s) en attente — ${eur(resteACollecter)} à collecter`, go: 'compta' });
  const aRapprocher = state.bank.filter(b => b.statut === 'a_rapprocher').length;
  if (aRapprocher) alertes.push({ badge: '<span class="badge b-info"><span class="dot"></span>Banque</span>', txt: `${aRapprocher} transaction(s) bancaire(s) à rapprocher`, go: 'compta' });
  if (prochaine && !prochaine.convocEnvoyee && prochaine.statut === 'preparation')
    alertes.push({ badge: '<span class="badge b-info"><span class="dot"></span>Codir</span>', txt: `Convocations non envoyées pour « ${prochaine.titre} »`, go: 'codir' });

  return `
  <div class="page-head">
    <div><h1 class="page-title">Tableau de bord</h1>
    <p class="page-sub">RC Val d'Adret — saison 2026-2027 · situation au ${dfr(TODAY)}</p></div>
  </div>
  <div class="grid kpis">
    <div class="card"><h3>Licenciés</h3><div class="kpi-value">${state.licencies.length}</div>
      <div class="kpi-note">${attenteFFR} licence(s) en attente FFR</div></div>
    <div class="card"><h3>Trésorerie</h3><div class="kpi-value">${eur(Math.round(solde))}</div>
      <div class="kpi-note">${eur(resteACollecter)} de cotisations à encaisser</div></div>
    <div class="card"><h3>Alertes stock</h3><div class="kpi-value">${sousSeuil.length + perimes.length}</div>
      <div class="kpi-note">${sousSeuil.length} sous seuil · ${perimes.length} péremption(s)</div></div>
    <div class="card"><h3>Prochaine réunion</h3>
      <div class="kpi-value" style="font-size:22px;line-height:1.15">${prochaine ? esc(prochaine.titre) : '—'}</div>
      <div class="kpi-note">${prochaine ? dfr(prochaine.date) + ' · ' + esc(prochaine.lieu) : 'Rien de planifié'}</div></div>
  </div>
  <div class="grid two-col">
    <div class="card">
      <h3>Trésorerie — 12 derniers mois</h3>
      ${chartSolde('dashSolde')}
    </div>
    <div class="card">
      <h3>À traiter</h3>
      ${alertes.length ? alertes.map(a => `<div class="alert-line">${a.badge}<span>${esc(a.txt)}</span>
        <button class="btn btn-sm" data-goto="${a.go}">Voir</button></div>`).join('') : '<p class="empty">Rien à signaler.</p>'}
    </div>
  </div>
  <div class="grid two-col">
    <div class="card">
      <h3>Effectifs par catégorie</h3>
      ${hbars(parCat.map(c => ({...c, label: c.label})), '--chart-s3')}
    </div>
    <div class="card">
      <h3>Cotisations</h3>
      ${(() => {
        const p = state.licencies.filter(l => l.cotStatut === 'payee').length;
        const pa = state.licencies.filter(l => l.cotStatut === 'partielle').length;
        const im = state.licencies.filter(l => l.cotStatut === 'impayee').length;
        const ex = state.licencies.filter(l => l.cotStatut === 'exoneree').length;
        const tot = p + pa + im || 1;
        return `<div class="vote-bar" style="height:20px" role="img" aria-label="Répartition des cotisations">
          <i class="vote-pour" style="width:${p/tot*100}%" title="Payées"></i>
          <i style="width:${pa/tot*100}%;background:var(--warning)" title="Partielles"></i>
          <i class="vote-contre" style="width:${im/tot*100}%" title="Impayées"></i>
        </div>
        <div class="legend">
          <span><span class="sw" style="background:var(--good)"></span>Payées : ${p}</span>
          <span><span class="sw" style="background:var(--warning)"></span>Partielles : ${pa}</span>
          <span><span class="sw" style="background:var(--critical)"></span>Impayées : ${im}</span>
          <span><span class="sw" style="background:var(--chart-axis)"></span>Exonérées : ${ex}</span>
        </div>
        <p style="font-size:12.5px;color:var(--ink-2);margin:10px 0 0">Le module de paiement en ligne (simulé ici) permet d'envoyer des liens de paiement et des relances automatiques — voir Comptabilité → Paiements.</p>`;
      })()}
    </div>
  </div>`;
}
</script>
<script>
/* ================= MODULE : LICENCIÉS ================= */

function viewLicencies() {
  const f = state.filtres.lic;
  let rows = state.licencies;
  if (f.q) { const q = f.q.toLowerCase(); rows = rows.filter(l => (l.prenom + ' ' + l.nom + ' ' + l.licence).toLowerCase().includes(q)); }
  if (f.cat) rows = rows.filter(l => l.cat === f.cat);
  if (f.cot) rows = rows.filter(l => l.cotStatut === f.cot);
  if (f.cert === 'ko') rows = rows.filter(l => daysUntil(l.certFin) < 0);
  if (f.cert === 'bientot') rows = rows.filter(l => { const d = daysUntil(l.certFin); return d >= 0 && d <= 60; });
  rows = [...rows].sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom, 'fr'));

  return `
  <div class="page-head">
    <div><h1 class="page-title">Licenciés</h1>
    <p class="page-sub">${state.licencies.length} licenciés — licences FFR, certificats médicaux et cotisations</p></div>
    <div class="head-actions">
      <button class="btn" id="btnExportLic">Exporter (simulé)</button>
      <button class="btn btn-primary" id="btnNewLic">+ Nouveau licencié</button>
    </div>
  </div>
  <div class="toolbar">
    <input type="search" id="licQ" placeholder="Rechercher un nom, un n° de licence…" value="${esc(f.q)}" aria-label="Recherche">
    <select id="licCat" aria-label="Filtrer par catégorie">
      <option value="">Toutes catégories</option>
      ${CATEGORIES.map(c => `<option value="${c.code}" ${f.cat === c.code ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
    </select>
    <select id="licCot" aria-label="Filtrer par cotisation">
      <option value="">Cotisation : toutes</option>
      <option value="payee" ${f.cot === 'payee' ? 'selected' : ''}>Payée</option>
      <option value="partielle" ${f.cot === 'partielle' ? 'selected' : ''}>Partielle</option>
      <option value="impayee" ${f.cot === 'impayee' ? 'selected' : ''}>Impayée</option>
    </select>
    <select id="licCert" aria-label="Filtrer par certificat">
      <option value="">Certificat : tous</option>
      <option value="ko" ${f.cert === 'ko' ? 'selected' : ''}>Expirés</option>
      <option value="bientot" ${f.cert === 'bientot' ? 'selected' : ''}>Expirent sous 60 j</option>
    </select>
    <span class="count-note">${rows.length} affiché(s)</span>
  </div>
  <div class="card" style="padding:4px 8px">
    <div class="table-wrap">
    <table>
      <thead><tr><th>Nom</th><th>Catégorie</th><th>Licence FFR</th><th>Certificat / attestation</th><th>Cotisation</th><th class="num">Réglé</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(l => `<tr class="rowlink" data-lic="${l.id}" tabindex="0">
          <td><strong>${esc(l.nom.toUpperCase())}</strong> ${esc(l.prenom)}<br><span style="color:var(--ink-3);font-size:12px">${l.naissance.slice(0,4)} · ${esc(l.ville)}</span></td>
          <td>${esc(catLabel(l.cat))}</td>
          <td>${l.licence}<br>${licBadge(l.licStatut)}</td>
          <td>${certBadge(l)}</td>
          <td>${cotBadge(l.cotStatut)}</td>
          <td class="num">${l.cot ? `${eur(l.cotPaye)} / ${eur(l.cot)}` : '—'}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="empty">Aucun licencié ne correspond aux filtres.</td></tr>'}
      </tbody>
    </table>
    </div>
  </div>`;
}

function openFicheLic(id) {
  const l = state.licencies.find(x => x.id === id);
  if (!l) return;
  const pays = state.paiements.filter(p => p.licId === id);
  openModal(`${l.prenom} ${l.nom}`, `
    <div class="form-grid" style="margin-bottom:14px">
      <div><label>Catégorie</label>${esc(catLabel(l.cat))}</div>
      <div><label>Né(e) le</label>${dfr(l.naissance)}</div>
      <div><label>Licence FFR</label>${l.licence} — ${licBadge(l.licStatut)}</div>
      <div><label>Certificat / attestation</label>${certBadge(l)}</div>
      <div><label>Email</label>${esc(l.email)}</div>
      <div><label>Téléphone</label>${esc(l.tel)}</div>
      <div><label>Commune</label>${esc(l.ville)}</div>
      <div><label>Au club depuis</label>${l.inscrit}</div>
    </div>
    <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);margin:0 0 8px">Cotisation 2026-2027</h3>
    <p style="margin:0 0 10px">${cotBadge(l.cotStatut)} &nbsp; ${l.cot ? `${eur(l.cotPaye)} réglés sur ${eur(l.cot)}` : 'Exonéré (dirigeant / éducateur)'}</p>
    ${pays.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Demande de paiement</th><th>Créée</th><th>Statut</th><th class="num">Montant</th></tr></thead>
      <tbody>${pays.map(p => `<tr><td>${esc(p.objet)}</td><td>${dfrShort(p.creee)}</td>
        <td>${p.statut === 'paye' ? '<span class="badge b-good"><span class="dot"></span>Payé le ' + dfrShort(p.payee) + '</span>' : p.statut === 'relancee' ? '<span class="badge b-serious"><span class="dot"></span>Relancé ×' + p.relances + '</span>' : '<span class="badge b-warn"><span class="dot"></span>Lien envoyé</span>'}</td>
        <td class="num">${eur(p.montant)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty" style="padding:6px 0">Aucune demande de paiement en ligne.</p>'}
  `, `
    ${l.cotStatut !== 'payee' && l.cot ? `<button class="btn" id="ficheLien" data-lic="${l.id}">Envoyer un lien de paiement</button>` : ''}
    <button class="btn" id="ficheEdit" data-lic="${l.id}">Modifier</button>
    <button class="btn btn-primary" onclick="closeModal()">Fermer</button>
  `);
  const lienBtn = $('#ficheLien');
  if (lienBtn) lienBtn.onclick = () => { creerDemandePaiement(l); closeModal(); render(); };
  $('#ficheEdit').onclick = () => openFormLic(l.id);
}

function creerDemandePaiement(l) {
  const montant = l.cot - l.cotPaye;
  state.paiements.unshift({ id: Date.now(), licId: l.id, objet: (l.cotPaye ? 'Solde cotisation' : 'Cotisation') + ' 2026-2027', montant, statut: 'envoyee', creee: TODAY, payee: null, relances: 0 });
  toast(`Lien de paiement de ${eur(montant)} envoyé à ${l.prenom} ${l.nom} (simulé)`);
}

function openFormLic(id) {
  const l = id ? state.licencies.find(x => x.id === id) : null;
  openModal(l ? 'Modifier le licencié' : 'Nouveau licencié', `
    <div class="form-grid">
      <div class="field"><label for="fPrenom">Prénom</label><input id="fPrenom" value="${l ? esc(l.prenom) : ''}"></div>
      <div class="field"><label for="fNom">Nom</label><input id="fNom" value="${l ? esc(l.nom) : ''}"></div>
      <div class="field"><label for="fNaiss">Date de naissance</label><input id="fNaiss" type="date" value="${l ? l.naissance : '2010-01-01'}"></div>
      <div class="field"><label for="fCat">Catégorie</label><select id="fCat">
        ${CATEGORIES.map(c => `<option value="${c.code}" ${l && l.cat === c.code ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select></div>
      <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" value="${l ? esc(l.email) : ''}"></div>
      <div class="field"><label for="fTel">Téléphone</label><input id="fTel" value="${l ? esc(l.tel) : ''}"></div>
      <div class="field"><label for="fVille">Commune</label><input id="fVille" value="${l ? esc(l.ville) : ''}"></div>
      <div class="field"><label for="fCert">Fin de validité certificat</label><input id="fCert" type="date" value="${l ? l.certFin : ''}"></div>
      <div class="field"><label for="fLicStatut">Statut licence FFR</label><select id="fLicStatut">
        <option value="attente" ${l && l.licStatut === 'attente' ? 'selected' : ''}>En attente FFR</option>
        <option value="validee" ${l && l.licStatut === 'validee' ? 'selected' : ''}>Validée</option>
        <option value="a_renouveler" ${l && l.licStatut === 'a_renouveler' ? 'selected' : ''}>À renouveler</option></select></div>
      <div class="field"><label for="fCotPaye">Montant réglé (€)</label><input id="fCotPaye" type="number" min="0" value="${l ? l.cotPaye : 0}"></div>
    </div>
    <p style="font-size:12px;color:var(--ink-3);margin:12px 0 0">Dans la version réelle : pièces jointes (certificat PDF, photo), envoi du dossier vers Oval-e / FFR, historique multi-saisons.</p>
  `, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="fSave">${l ? 'Enregistrer' : 'Créer le licencié'}</button>
  `);
  $('#fSave').onclick = () => {
    const cat = CATEGORIES.find(c => c.code === $('#fCat').value);
    const prenom = $('#fPrenom').value.trim(), nom = $('#fNom').value.trim();
    if (!prenom || !nom) { toast('Prénom et nom sont obligatoires.'); return; }
    const cotPaye = Math.max(0, Number($('#fCotPaye').value) || 0);
    const cotStatut = cat.cot === 0 ? 'exoneree' : cotPaye >= cat.cot ? 'payee' : cotPaye > 0 ? 'partielle' : 'impayee';
    const base = {
      prenom, nom, naissance: $('#fNaiss').value, cat: cat.code,
      email: $('#fEmail').value.trim(), tel: $('#fTel').value.trim(), ville: $('#fVille').value.trim() || 'Val d\'Adret',
      certFin: $('#fCert').value || addDaysIso(TODAY, 365),
      licStatut: $('#fLicStatut').value,
      cot: cat.cot, cotPaye: Math.min(cotPaye, cat.cot), cotStatut,
    };
    if (l) { Object.assign(l, base); toast(`Fiche de ${prenom} ${nom} mise à jour.`); }
    else {
      state.licencies.push({ id: Date.now(), sexe: 'M', licence: '2026' + ri(100000, 999999), inscrit: 2026, ...base });
      toast(`${prenom} ${nom} ajouté aux licenciés.`);
    }
    closeModal(); render();
  };
}
</script>
<script>
/* ================= MODULE : COMPTABILITÉ ================= */

function viewCompta() {
  const tabs = [
    { id:'synthese', label:'Synthèse' },
    { id:'banque', label:'Banque & rapprochement' },
    { id:'paiements', label:'Paiements en ligne' },
    { id:'journal', label:'Journal' },
  ];
  const t = subTabs.compta;
  let body = '';
  if (t === 'synthese') body = comptaSynthese();
  else if (t === 'banque') body = comptaBanque();
  else if (t === 'paiements') body = comptaPaiements();
  else body = comptaJournal();
  return `
  <div class="page-head">
    <div><h1 class="page-title">Comptabilité</h1>
    <p class="page-sub">Exercice 2026-2027 · connecteur bancaire et paiement en ligne simulés</p></div>
    <div class="head-actions"><button class="btn" id="btnNewEcriture">+ Écriture manuelle</button></div>
  </div>
  <div class="tabs" role="tablist">${tabs.map(x => `<button role="tab" aria-selected="${t === x.id}" class="${t === x.id ? 'active' : ''}" data-ctab="${x.id}">${x.label}</button>`).join('')}</div>
  <div class="tab-body">${body}</div>`;
}

function comptaSynthese() {
  const solde = soldeCourant();
  const now = '2026-';
  const exercice = state.ecritures.filter(e => e.date >= '2026-07-01'); // exercice depuis juillet
  const rec = exercice.filter(e => e.sens === 'R').reduce((s, e) => s + e.montant, 0);
  const dep = exercice.filter(e => e.sens === 'D').reduce((s, e) => s + e.montant, 0);
  const parCatDep = CAT_DEPENSES.map(c => ({ label: c, v: state.ecritures.filter(e => e.sens === 'D' && e.cat === c && e.date >= '2025-10-01').reduce((s, e) => s + e.montant, 0) }))
    .filter(c => c.v > 0).sort((a, b) => b.v - a.v);
  const aRappro = state.bank.filter(b => b.statut === 'a_rapprocher');
  return `
  <div class="grid kpis">
    <div class="card"><h3>Solde de trésorerie</h3><div class="kpi-value">${eur(Math.round(solde))}</div>
      <div class="kpi-note">Compte courant Crédit Agricole (simulé)</div></div>
    <div class="card"><h3>Recettes exercice</h3><div class="kpi-value" style="color:var(--good-text)">${eur(rec)}</div>
      <div class="kpi-note">depuis le 1er juillet 2026</div></div>
    <div class="card"><h3>Dépenses exercice</h3><div class="kpi-value" style="color:var(--critical-text)">${eur(dep)}</div>
      <div class="kpi-note">depuis le 1er juillet 2026</div></div>
    <div class="card"><h3>À rapprocher</h3><div class="kpi-value">${aRappro.length}</div>
      <div class="kpi-note">transactions bancaires en attente</div></div>
  </div>
  <div class="grid two-col">
    <div class="card"><h3>Recettes / dépenses — 12 mois</h3>${chartMensuel('comptaMensuel')}</div>
    <div class="card"><h3>Dépenses par poste (12 mois)</h3>${hbars(parCatDep, '--chart-s2')}</div>
  </div>`;
}

function comptaBanque() {
  const f = state.filtres.banque;
  let rows = state.bank;
  if (f.statut) rows = rows.filter(b => b.statut === f.statut);
  const aRappro = state.bank.filter(b => b.statut === 'a_rapprocher').length;
  return `
  <div class="toolbar">
    <button class="btn btn-primary" id="btnSync">⟳ Synchroniser avec la banque</button>
    <select id="bqStatut" aria-label="Filtrer par statut">
      <option value="">Toutes les transactions</option>
      <option value="a_rapprocher" ${f.statut === 'a_rapprocher' ? 'selected' : ''}>À rapprocher (${aRappro})</option>
      <option value="rapprochee" ${f.statut === 'rapprochee' ? 'selected' : ''}>Rapprochées</option>
    </select>
    <span class="count-note">Dernière synchro : aujourd'hui 08:12 (simulée)</span>
  </div>
  <div class="card" style="padding:4px 8px">
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Libellé bancaire</th><th class="num">Montant</th><th>Statut</th><th>Catégorie</th><th></th></tr></thead>
      <tbody>${rows.slice(0, 40).map(b => `<tr>
        <td style="white-space:nowrap">${dfrShort(b.date)}</td>
        <td style="font-family:ui-monospace,monospace;font-size:12px">${esc(b.libelle)}</td>
        <td class="num" style="color:${b.montant >= 0 ? 'var(--good-text)' : 'var(--critical-text)'};font-weight:600">${b.montant >= 0 ? '+' : ''}${eur(b.montant)}</td>
        <td>${b.statut === 'rapprochee' ? '<span class="badge b-good"><span class="dot"></span>Rapprochée</span>' : '<span class="badge b-warn"><span class="dot"></span>À rapprocher</span>'}</td>
        <td>${b.statut === 'rapprochee' ? esc(b.catProposee) : `<select data-cat-for="${b.id}" aria-label="Catégorie">
            ${[...CAT_RECETTES, ...CAT_DEPENSES].map(c => `<option ${c === b.catProposee ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`}</td>
        <td>${b.statut === 'a_rapprocher' ? `<button class="btn btn-sm btn-primary" data-rappro="${b.id}">Valider</button>` : ''}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>
  <p style="font-size:12.5px;color:var(--ink-2)">Dans la version réelle : connexion DSP2 (Bridge, Powens ou GoCardless) au compte du club, catégorisation automatique apprise, règles de rapprochement avec les demandes de paiement.</p>`;
}

function syncBanque() {
  const nouvelles = [
    { libelle: 'VIR SEPA MME ROUSSEL COTISATION', montant: 175, cat: 'Cotisations' },
    { libelle: 'CB DECATHLON PRO 16/09', montant: -184.5, cat: 'Équipement sportif' },
    { libelle: 'REMISE CB BUVETTE 14/09', montant: 236, cat: 'Buvette' },
    { libelle: 'PRLV SEPA SC OVALIE TELECOM', montant: -29.9, cat: 'Frais administratifs' },
  ];
  let bid = Math.max(...state.bank.map(b => b.id)) + 1;
  for (const n of nouvelles) {
    state.bank.unshift({ id: bid++, date: addDaysIso(TODAY, -ri(0, 3)), libelle: n.libelle, montant: n.montant, statut: 'a_rapprocher', ecritureId: null, catProposee: n.cat });
  }
  state.bank.sort((a, b) => b.date.localeCompare(a.date));
  toast(`${nouvelles.length} nouvelles transactions importées depuis la banque (simulé).`);
}

function rapprocher(id) {
  const b = state.bank.find(x => x.id === id);
  if (!b) return;
  const sel = $(`[data-cat-for="${id}"]`);
  const cat = sel ? sel.value : b.catProposee;
  const ec = { id: Date.now(), date: b.date, sens: b.montant >= 0 ? 'R' : 'D', cat, libelle: b.libelle.replace(/^(VIR SEPA |VIR INST |PRLV SEPA |CB |REMISE CHEQUE |REMISE CB |CHEQUE N°\d+ )/,'').trim() || cat, montant: Math.abs(b.montant) };
  state.ecritures.unshift(ec);
  state.ecritures.sort((a, b2) => b2.date.localeCompare(a.date));
  b.statut = 'rapprochee'; b.ecritureId = ec.id; b.catProposee = cat;
  toast(`Transaction rapprochée — écriture « ${cat} » créée.`);
}

function comptaPaiements() {
  const enAttente = state.paiements.filter(p => p.statut !== 'paye');
  const payes = state.paiements.filter(p => p.statut === 'paye');
  const totAttente = enAttente.reduce((s, p) => s + p.montant, 0);
  const totMois = payes.filter(p => p.payee >= '2026-09-01').reduce((s, p) => s + p.montant, 0);
  const licName = id => { const l = state.licencies.find(x => x.id === id); return l ? `${l.prenom} ${l.nom}` : '—'; };
  const ligne = p => `<tr>
    <td><strong>${esc(licName(p.licId))}</strong><br><span style="color:var(--ink-3);font-size:12px">${esc(p.objet)}</span></td>
    <td>${dfrShort(p.creee)}</td>
    <td>${p.statut === 'paye' ? '<span class="badge b-good"><span class="dot"></span>Payé le ' + dfrShort(p.payee) + '</span>'
        : p.statut === 'relancee' ? `<span class="badge b-serious"><span class="dot"></span>Relancé ×${p.relances}</span>`
        : '<span class="badge b-warn"><span class="dot"></span>Lien envoyé</span>'}</td>
    <td class="num" style="font-weight:600">${eur(p.montant)}</td>
    <td style="white-space:nowrap">${p.statut !== 'paye' ? `
      <button class="btn btn-sm" data-relance="${p.id}">Relancer</button>
      <button class="btn btn-sm btn-primary" data-simulpay="${p.id}" title="Simule le paiement par la famille">Simuler le paiement</button>` : ''}</td>
  </tr>`;
  return `
  <div class="grid kpis">
    <div class="card"><h3>En attente de paiement</h3><div class="kpi-value">${eur(totAttente)}</div>
      <div class="kpi-note">${enAttente.length} lien(s) actif(s)</div></div>
    <div class="card"><h3>Encaissé en septembre</h3><div class="kpi-value" style="color:var(--good-text)">${eur(totMois)}</div>
      <div class="kpi-note">${payes.filter(p => p.payee >= '2026-09-01').length} paiement(s) en ligne</div></div>
    <div class="card"><h3>Comment ça marche</h3>
      <p style="font-size:12.5px;color:var(--ink-2);margin:0">Chaque famille reçoit un lien de paiement par email (CB / virement). Le paiement crée automatiquement l'écriture comptable et met la cotisation à jour. Ici tout est simulé.</p></div>
  </div>
  <div class="toolbar" style="margin-top:16px">
    <button class="btn btn-primary" id="btnNewPay">+ Nouvelle demande de paiement</button>
    <button class="btn" id="btnRelanceAll">Relancer tous les impayés</button>
  </div>
  <div class="card" style="padding:4px 8px">
    <div class="table-wrap"><table>
      <thead><tr><th>Licencié</th><th>Créée</th><th>Statut</th><th class="num">Montant</th><th>Actions</th></tr></thead>
      <tbody>
        ${enAttente.map(ligne).join('')}
        ${payes.slice(0, 12).map(ligne).join('')}
        ${!state.paiements.length ? '<tr><td colspan="5" class="empty">Aucune demande de paiement.</td></tr>' : ''}
      </tbody>
    </table></div>
  </div>`;
}

function simulerPaiement(pid) {
  const p = state.paiements.find(x => x.id === pid);
  if (!p) return;
  p.statut = 'paye'; p.payee = TODAY;
  const l = state.licencies.find(x => x.id === p.licId);
  if (l) { l.cotPaye = Math.min(l.cot, l.cotPaye + p.montant); l.cotStatut = l.cotPaye >= l.cot ? 'payee' : 'partielle'; }
  const ec = { id: Date.now(), date: TODAY, sens: 'R', cat: 'Cotisations', libelle: 'Paiement en ligne — ' + (l ? l.prenom + ' ' + l.nom : ''), montant: p.montant };
  state.ecritures.unshift(ec);
  state.bank.unshift({ id: Date.now() + 1, date: TODAY, libelle: 'VIR INST OVALIE-PAY ' + (l ? l.nom.toUpperCase() : ''), montant: p.montant, statut: 'rapprochee', ecritureId: ec.id, catProposee: 'Cotisations' });
  toast(`Paiement de ${eur(p.montant)} reçu — écriture et cotisation mises à jour.`);
}

function openFormPaiement() {
  const candidats = state.licencies.filter(l => l.cotStatut === 'impayee' || l.cotStatut === 'partielle');
  openModal('Nouvelle demande de paiement', `
    <div class="form-grid">
      <div class="field"><label for="pLic">Licencié</label><select id="pLic">
        ${candidats.map(l => `<option value="${l.id}">${esc(l.nom.toUpperCase() + ' ' + l.prenom)} — reste ${eur(l.cot - l.cotPaye)}</option>`).join('')}</select></div>
      <div class="field"><label for="pObjet">Objet</label><input id="pObjet" value="Cotisation 2026-2027"></div>
      <div class="field"><label for="pMontant">Montant (€)</label><input id="pMontant" type="number" min="1" value="${candidats.length ? candidats[0].cot - candidats[0].cotPaye : 100}"></div>
      <div class="field"><label>Canal</label><select id="pCanal"><option>Email</option><option>SMS</option><option>Email + SMS</option></select></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="pSend">Envoyer le lien</button>`);
  $('#pLic').onchange = () => { const l = state.licencies.find(x => x.id === Number($('#pLic').value)); if (l) $('#pMontant').value = l.cot - l.cotPaye; };
  $('#pSend').onclick = () => {
    const l = state.licencies.find(x => x.id === Number($('#pLic').value));
    if (!l) return;
    state.paiements.unshift({ id: Date.now(), licId: l.id, objet: $('#pObjet').value, montant: Number($('#pMontant').value) || 0, statut: 'envoyee', creee: TODAY, payee: null, relances: 0 });
    toast(`Lien de paiement envoyé à ${l.prenom} ${l.nom} (simulé).`);
    closeModal(); render();
  };
}

function comptaJournal() {
  return `
  <div class="card" style="padding:4px 8px;margin-top:2px">
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th class="num">Recette</th><th class="num">Dépense</th></tr></thead>
      <tbody>${state.ecritures.slice(0, 60).map(e => `<tr>
        <td style="white-space:nowrap">${dfrShort(e.date)}</td>
        <td>${esc(e.libelle)}</td>
        <td><span class="badge">${esc(e.cat)}</span></td>
        <td class="num" style="color:var(--good-text)">${e.sens === 'R' ? eur(e.montant) : ''}</td>
        <td class="num" style="color:var(--critical-text)">${e.sens === 'D' ? eur(e.montant) : ''}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>
  <p style="font-size:12.5px;color:var(--ink-2)">${state.ecritures.length} écritures sur l'exercice glissant. Dans la version réelle : export FEC / compte de résultat associatif, budgets par section, pièces justificatives attachées.</p>`;
}

function openFormEcriture() {
  openModal('Écriture manuelle', `
    <div class="form-grid">
      <div class="field"><label for="eDate">Date</label><input id="eDate" type="date" value="${TODAY}"></div>
      <div class="field"><label for="eSens">Sens</label><select id="eSens"><option value="R">Recette</option><option value="D">Dépense</option></select></div>
      <div class="field"><label for="eCat">Catégorie</label><select id="eCat">${[...CAT_RECETTES, ...CAT_DEPENSES].map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label for="eMontant">Montant (€)</label><input id="eMontant" type="number" min="0" step="0.01" value="0"></div>
      <div class="field" style="grid-column:1/-1"><label for="eLib">Libellé</label><input id="eLib" placeholder="ex. Vente calendriers école de rugby"></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="eSave">Enregistrer</button>`);
  $('#eSave').onclick = () => {
    const m = Number($('#eMontant').value);
    if (!m || !$('#eLib').value.trim()) { toast('Libellé et montant sont obligatoires.'); return; }
    state.ecritures.unshift({ id: Date.now(), date: $('#eDate').value || TODAY, sens: $('#eSens').value, cat: $('#eCat').value, libelle: $('#eLib').value.trim(), montant: m });
    state.ecritures.sort((a, b) => b.date.localeCompare(a.date));
    toast('Écriture enregistrée.');
    closeModal(); render();
  };
}
</script>
<script>
/* ================= MODULE : STOCK MULTI-PÔLES ================= */

function viewStock() {
  const f = state.filtres.stock;
  const pole = subTabs.stockPole;
  let rows = pole === 'tous' ? state.stock : state.stock.filter(a => a.pole === pole);
  if (f.alerte) rows = rows.filter(a => a.qte <= a.seuil || (a.peremption && daysUntil(a.peremption) <= 60));
  const { sousSeuil, perimes } = alertesStock();
  const poleLabel = c => (POLES.find(p => p.code === c) || {label:c}).label;
  const nbAlertes = c => state.stock.filter(a => a.pole === c && (a.qte <= a.seuil || (a.peremption && daysUntil(a.peremption) <= 60))).length;

  const gauge = a => {
    const ratio = a.seuil ? a.qte / (a.seuil * 2) : 1;
    const cls = a.qte <= a.seuil ? 'low' : a.qte <= a.seuil * 1.4 ? 'mid' : '';
    return `<div class="gauge ${cls}" role="img" aria-label="${a.qte} ${a.unite} pour un seuil de ${a.seuil}"><i style="width:${Math.min(100, ratio * 100).toFixed(0)}%"></i></div>`;
  };
  const peremp = a => {
    if (!a.peremption) return '<span style="color:var(--ink-3)">—</span>';
    const d = daysUntil(a.peremption);
    if (d < 0) return `<span class="badge b-crit"><span class="dot"></span>Périmé (${dfrShort(a.peremption)})</span>`;
    if (d <= 60) return `<span class="badge b-warn"><span class="dot"></span>${dfrShort(a.peremption)} (${d} j)</span>`;
    return `<span style="color:var(--ink-2)">${dfrShort(a.peremption)}</span>`;
  };

  return `
  <div class="page-head">
    <div><h1 class="page-title">Stock</h1>
    <p class="page-sub">${state.stock.length} références réparties sur ${POLES.length} pôles · ${sousSeuil.length} sous seuil, ${perimes.length} péremption(s) à surveiller</p></div>
    <div class="head-actions">
      <button class="btn" id="btnHistoStock">Historique des mouvements</button>
      <button class="btn btn-primary" id="btnNewArt">+ Nouvel article</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${pole === 'tous'}" class="${pole === 'tous' ? 'active' : ''}" data-pole="tous">Tous les pôles</button>
    ${POLES.map(p => `<button role="tab" aria-selected="${pole === p.code}" class="${pole === p.code ? 'active' : ''}" data-pole="${p.code}">${p.label}${nbAlertes(p.code) ? ` <span class="badge b-serious" style="margin-left:4px">${nbAlertes(p.code)}</span>` : ''}</button>`).join('')}
  </div>
  <div class="toolbar">
    <label style="display:flex;align-items:center;gap:7px;margin:0;font-size:13px;font-weight:500;color:var(--ink)">
      <input type="checkbox" id="stAlerte" ${f.alerte ? 'checked' : ''}> Uniquement les alertes</label>
    <span class="count-note">${rows.length} référence(s)</span>
  </div>
  <div class="card" style="padding:4px 8px">
    <div class="table-wrap"><table>
      <thead><tr><th>Article</th>${pole === 'tous' ? '<th>Pôle</th>' : ''}<th class="num">Quantité</th><th>Niveau</th><th class="num">Seuil</th><th>Péremption</th><th>Emplacement</th><th>Mouvement</th></tr></thead>
      <tbody>${rows.length ? rows.map(a => `<tr>
        <td><strong>${esc(a.nom)}</strong>${a.qte <= a.seuil ? ' <span class="badge b-crit" style="margin-left:4px"><span class="dot"></span>Sous seuil</span>' : ''}</td>
        ${pole === 'tous' ? `<td><span class="badge">${esc(poleLabel(a.pole))}</span></td>` : ''}
        <td class="num" style="font-weight:600">${a.qte} <span style="color:var(--ink-3);font-weight:400">${esc(a.unite)}</span></td>
        <td>${gauge(a)}</td>
        <td class="num" style="color:var(--ink-3)">${a.seuil}</td>
        <td>${peremp(a)}</td>
        <td style="color:var(--ink-2)">${esc(a.empl)}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm" data-mv="-" data-art="${a.id}" aria-label="Sortie de stock">− Sortie</button>
          <button class="btn btn-sm" data-mv="+" data-art="${a.id}" aria-label="Entrée en stock">+ Entrée</button>
        </td>
      </tr>`).join('') : '<tr><td colspan="8" class="empty">Aucun article dans ce pôle.</td></tr>'}</tbody>
    </table></div>
  </div>
  <p style="font-size:12.5px;color:var(--ink-2)">Dans la version réelle : inventaires annuels avec écarts, affectation par équipe (jeu de maillots M16 → resp. catégorie), commandes fournisseurs générées depuis les seuils, scan code-barres pour la buvette.</p>`;
}

function openMouvement(artId, sens) {
  const a = state.stock.find(x => x.id === artId);
  if (!a) return;
  openModal(`${sens === '+' ? 'Entrée' : 'Sortie'} — ${a.nom}`, `
    <p style="margin:0 0 12px;color:var(--ink-2)">Stock actuel : <strong style="color:var(--ink)">${a.qte} ${esc(a.unite)}</strong> · seuil d'alerte : ${a.seuil}</p>
    <div class="form-grid">
      <div class="field"><label for="mvQte">Quantité</label><input id="mvQte" type="number" min="1" value="1"></div>
      <div class="field"><label for="mvMotif">Motif</label><select id="mvMotif">
        ${(sens === '+' ? ['Réassort','Achat','Don partenaire','Retour matériel','Correction d\'inventaire']
          : ['Sortie match','Sortie entraînement','Usage infirmerie','Vente buvette','Casse / perte','Correction d\'inventaire']).map(m => `<option>${m}</option>`).join('')}</select></div>
      <div class="field" style="grid-column:1/-1"><label for="mvQui">Par</label><input id="mvQui" value="J.-M. Fabre"></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="mvSave">Enregistrer le mouvement</button>`);
  $('#mvSave').onclick = () => {
    const q = Math.max(1, Number($('#mvQte').value) || 1);
    const delta = sens === '+' ? q : -q;
    if (a.qte + delta < 0) { toast('Le stock ne peut pas devenir négatif.'); return; }
    a.qte += delta;
    state.mouvements.unshift({ id: Date.now(), date: TODAY, artId: a.id, delta, motif: $('#mvMotif').value, par: $('#mvQui').value.trim() || '—' });
    toast(`${sens === '+' ? '+' : '−'}${q} ${a.unite} — ${a.nom} : ${a.qte} ${a.unite} en stock.` + (a.qte <= a.seuil ? ' ⚠ Sous le seuil.' : ''));
    closeModal(); render();
  };
}

function openHistoStock() {
  const nomArt = id => { const a = state.stock.find(x => x.id === id); return a ? a.nom : '—'; };
  openModal('Historique des mouvements', `
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Article</th><th class="num">Δ</th><th>Motif</th><th>Par</th></tr></thead>
      <tbody>${state.mouvements.slice(0, 40).map(m => `<tr>
        <td style="white-space:nowrap">${dfrShort(m.date)}</td>
        <td>${esc(nomArt(m.artId))}</td>
        <td class="num" style="font-weight:600;color:${m.delta >= 0 ? 'var(--good-text)' : 'var(--critical-text)'}">${m.delta >= 0 ? '+' : ''}${m.delta}</td>
        <td>${esc(m.motif)}</td><td style="color:var(--ink-2)">${esc(m.par)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`, `<button class="btn btn-primary" onclick="closeModal()">Fermer</button>`);
}

function openFormArticle() {
  openModal('Nouvel article', `
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label for="aNom">Désignation</label><input id="aNom" placeholder="ex. Bouteilles d'eau 50 cl"></div>
      <div class="field"><label for="aPole">Pôle</label><select id="aPole">${POLES.map(p => `<option value="${p.code}">${p.label}</option>`).join('')}</select></div>
      <div class="field"><label for="aUnite">Unité</label><input id="aUnite" value="u."></div>
      <div class="field"><label for="aQte">Quantité initiale</label><input id="aQte" type="number" min="0" value="0"></div>
      <div class="field"><label for="aSeuil">Seuil d'alerte</label><input id="aSeuil" type="number" min="0" value="5"></div>
      <div class="field"><label for="aEmpl">Emplacement</label><input id="aEmpl" placeholder="ex. Local matériel"></div>
      <div class="field"><label for="aPeremp">Péremption (optionnel)</label><input id="aPeremp" type="date"></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="aSave">Créer l'article</button>`);
  $('#aSave').onclick = () => {
    const nom = $('#aNom').value.trim();
    if (!nom) { toast('La désignation est obligatoire.'); return; }
    state.stock.push({ id: Date.now(), pole: $('#aPole').value, nom, qte: Number($('#aQte').value) || 0, seuil: Number($('#aSeuil').value) || 0, unite: $('#aUnite').value.trim() || 'u.', empl: $('#aEmpl').value.trim() || '—', peremption: $('#aPeremp').value || null });
    toast(`Article « ${nom} » créé.`);
    closeModal(); render();
  };
}
</script>
<script>
/* ================= MODULE : CODIR & AG ================= */

const statutReunion = s => ({
  preparation: '<span class="badge b-info"><span class="dot"></span>En préparation</span>',
  en_cours: '<span class="badge b-warn"><span class="dot"></span>En séance</span>',
  terminee: '<span class="badge b-good"><span class="dot"></span>Terminée</span>',
}[s] || esc(s));

function viewCodir() {
  if (subTabs.codirOpen) return viewReunion(subTabs.codirOpen);
  const reunions = [...state.reunions].sort((a, b) => b.date.localeCompare(a.date));
  return `
  <div class="page-head">
    <div><h1 class="page-title">Codir & assemblées</h1>
    <p class="page-sub">Comité directeur de 8 membres · préparation, séance, votes et comptes-rendus</p></div>
    <div class="head-actions"><button class="btn btn-primary" id="btnNewReu">+ Planifier une réunion</button></div>
  </div>
  <div class="grid two-col">
    <div>
      <div class="card" style="padding:4px 8px">
        <div class="table-wrap"><table>
          <thead><tr><th>Réunion</th><th>Date</th><th>Statut</th><th>Votes</th></tr></thead>
          <tbody>${reunions.map(r => `<tr class="rowlink" data-reu="${r.id}" tabindex="0">
            <td><strong>${esc(r.titre)}</strong><br><span style="color:var(--ink-3);font-size:12px">${r.type === 'AG' ? 'Assemblée générale' : 'Comité directeur'} · ${esc(r.lieu)}</span></td>
            <td style="white-space:nowrap">${dfr(r.date)}<br><span style="color:var(--ink-3);font-size:12px">${r.heure}</span></td>
            <td>${statutReunion(r.statut)}</td>
            <td>${r.votes.filter(v => v.statut === 'clos').length}/${r.votes.length} clos</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <h3>Comité directeur</h3>
      ${state.bureau.map(m => `<div class="alert-line"><strong style="min-width:0">${esc(m.nom)}</strong><span class="when">${esc(m.role)}</span></div>`).join('')}
    </div>
  </div>`;
}

function viewReunion(id) {
  const r = state.reunions.find(x => x.id === id);
  if (!r) { subTabs.codirOpen = null; return viewCodir(); }
  const t = subTabs.codirTab;
  const tabs = [
    { id:'preparation', label:'Préparation' },
    { id:'seance', label:'Séance' },
    { id:'votes', label:`Votes (${r.votes.length})` },
    { id:'cr', label:'Compte-rendu' },
  ];
  let body = '';
  if (t === 'preparation') body = reunionPrep(r);
  else if (t === 'seance') body = reunionSeance(r);
  else if (t === 'votes') body = reunionVotes(r);
  else body = reunionCR(r);
  return `
  <div class="page-head">
    <div>
      <p class="page-sub" style="margin:0 0 4px"><button class="btn btn-sm" id="btnBackReu">← Toutes les réunions</button></p>
      <h1 class="page-title">${esc(r.titre)}</h1>
      <p class="page-sub">${r.type === 'AG' ? 'Assemblée générale' : 'Comité directeur'} · ${dfr(r.date)} à ${r.heure} · ${esc(r.lieu)} · ${statutReunion(r.statut)}</p>
    </div>
  </div>
  <div class="tabs" role="tablist">${tabs.map(x => `<button role="tab" aria-selected="${t === x.id}" class="${t === x.id ? 'active' : ''}" data-rtab="${x.id}">${x.label}</button>`).join('')}</div>
  <div class="tab-body">${body}</div>`;
}

function reunionPrep(r) {
  return `
  <div class="grid two-col">
    <div class="card">
      <h3>Ordre du jour</h3>
      ${r.odj.map((o, i) => `<div class="odj-item">
        <span class="odj-num">${i + 1}.</span>
        <div style="min-width:0"><strong>${esc(o.titre)}</strong>${o.note ? `<br><span style="color:var(--ink-2);font-size:12.5px">${esc(o.note)}</span>` : ''}</div>
        ${r.statut === 'preparation' ? `<button class="x-btn" data-delodj="${o.id}" title="Retirer ce point" style="margin-left:auto">✕</button>` : ''}
      </div>`).join('')}
      ${r.statut === 'preparation' ? `
      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="odjNew" placeholder="Ajouter un point à l'ordre du jour…" style="flex:1">
        <button class="btn" id="odjAdd">Ajouter</button>
      </div>` : ''}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>Convocations</h3>
        <p style="margin:0 0 10px;font-size:13px;color:var(--ink-2)">${r.type === 'AG' ? `${r.convoquees} membres à convoquer (15 jours avant, statuts art. 11)` : `${r.convoquees} membres du comité à convoquer`}</p>
        ${r.statut === 'preparation'
          ? (r.convocEnvoyee
            ? '<span class="badge b-good"><span class="dot"></span>Convocations envoyées</span>'
            : `<button class="btn btn-primary" id="btnConvoc">Envoyer les convocations (simulé)</button>`)
          : `<span class="badge b-good"><span class="dot"></span>Envoyées · ${r.presents} présent(s)${r.pouvoirs ? ' + ' + r.pouvoirs + ' pouvoirs' : ''}</span>`}
      </div>
      <div class="card">
        <h3>Documents joints</h3>
        ${r.docs.map(d => `<div class="alert-line"><span>📄 ${esc(d)}</span><span class="when">PDF</span></div>`).join('') || '<p class="empty">Aucun document.</p>'}
        <button class="btn btn-sm" style="margin-top:10px" id="btnDocAdd">+ Joindre un document (simulé)</button>
      </div>
    </div>
  </div>`;
}

function reunionSeance(r) {
  const presents = Object.values(r.presence).filter(Boolean).length;
  const quorumMin = Math.ceil(r.convoquees * r.quorumPct / 100);
  const quorumOk = (r.statut === 'terminee' ? r.presents + r.pouvoirs : presents) >= quorumMin;
  return `
  <div class="grid two-col">
    <div class="card">
      <h3>Déroulé de la séance</h3>
      ${r.odj.map((o, i) => `<div class="odj-item">
        <span class="odj-num">${i + 1}.</span>
        <div style="min-width:0;flex:1">
          <strong>${esc(o.titre)}</strong>
          ${o.note ? `<br><span style="color:var(--ink-2);font-size:12.5px">${esc(o.note)}</span>` : ''}
          ${r.statut !== 'terminee' ? `<div style="margin-top:6px"><input data-note-for="${o.id}" placeholder="Décision / note de séance…" value="${esc(o.note)}" style="width:100%"></div>` : ''}
        </div>
        <label style="margin:0;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap">
          <input type="checkbox" data-fait="${o.id}" ${o.fait ? 'checked' : ''} ${r.statut === 'terminee' ? 'disabled' : ''}> traité</label>
      </div>`).join('')}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>Quorum</h3>
        ${r.statut === 'terminee'
          ? `<p style="margin:0"><strong>${r.presents} présents</strong>${r.pouvoirs ? ` + ${r.pouvoirs} pouvoirs` : ''} sur ${r.convoquees} convoqués.<br>
             <span class="badge ${quorumOk ? 'b-good' : 'b-crit'}" style="margin-top:6px"><span class="dot"></span>Quorum ${quorumOk ? 'atteint' : 'non atteint'} (min. ${quorumMin})</span></p>`
          : `<p style="margin:0 0 8px"><strong>${presents}</strong> présent(s) émargés · quorum : ${quorumMin} (${r.quorumPct} %)
             <span class="badge ${quorumOk ? 'b-good' : 'b-warn'}" style="margin-left:6px"><span class="dot"></span>${quorumOk ? 'Atteint' : 'Pas encore atteint'}</span></p>`}
      </div>
      ${r.type !== 'AG' ? `<div class="card">
        <h3>Émargement</h3>
        <div class="presence-grid">
          ${state.bureau.map(m => `<label><input type="checkbox" data-pres="${m.id}" ${r.presence[m.id] ? 'checked' : ''} ${r.statut === 'terminee' ? 'disabled' : ''}> ${esc(m.nom)}</label>`).join('')}
        </div>
      </div>` : `<div class="card"><h3>Émargement AG</h3><p style="margin:0;font-size:13px;color:var(--ink-2)">${r.statut === 'terminee' ? `Feuille d'émargement archivée : ${r.presents} signatures + ${r.pouvoirs} pouvoirs.` : 'L\'émargement des adhérents se fait à l\'entrée (liste imprimée ou tablette).'}</p></div>`}
    </div>
  </div>`;
}

function reunionVotes(r) {
  const totalVotants = r.type === 'AG' ? (r.presents + r.pouvoirs || 54) : Math.max(Object.values(r.presence).filter(Boolean).length, r.presents) || state.bureau.length;
  const bar = v => {
    const tot = v.pour + v.contre + v.abst || 1;
    return `<div class="vote-bar" role="img" aria-label="Pour ${v.pour}, contre ${v.contre}, abstentions ${v.abst}">
      <i class="vote-pour" style="width:${v.pour / tot * 100}%"></i>
      <i class="vote-contre" style="width:${v.contre / tot * 100}%"></i>
      <i class="vote-abst" style="width:${v.abst / tot * 100}%"></i>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><span class="sw" style="background:var(--good)"></span>Pour : ${v.pour}</span>
      <span><span class="sw" style="background:var(--critical)"></span>Contre : ${v.contre}</span>
      <span><span class="sw" style="background:var(--chart-axis)"></span>Abst. : ${v.abst}</span>
    </div>`;
  };
  return `
  <div class="grid" style="grid-template-columns:1fr;max-width:760px">
    ${r.votes.map(v => `<div class="card">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
        <strong style="flex:1;min-width:200px">${esc(v.titre)}</strong>
        ${v.statut === 'clos'
          ? (v.resultat === 'adopte' ? '<span class="badge b-good"><span class="dot"></span>Adoptée</span>' : '<span class="badge b-crit"><span class="dot"></span>Rejetée</span>')
          : v.statut === 'ouvert' ? '<span class="badge b-warn"><span class="dot"></span>Vote en cours</span>' : '<span class="badge"><span class="dot"></span>À ouvrir</span>'}
      </div>
      <div style="margin-top:10px">
        ${v.statut === 'a_ouvrir'
          ? `<p style="font-size:13px;color:var(--ink-2);margin:0 0 10px">Le vote sera ouvert en séance. Votants attendus : ${totalVotants}.</p>
             ${r.statut !== 'terminee' ? `<button class="btn btn-primary btn-sm" data-vopen="${v.id}">Ouvrir le vote</button>` : ''}`
          : v.statut === 'ouvert'
          ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
              <div class="field"><label for="vp${v.id}">Pour</label><input id="vp${v.id}" type="number" min="0" value="${v.pour}" style="width:80px"></div>
              <div class="field"><label for="vc${v.id}">Contre</label><input id="vc${v.id}" type="number" min="0" value="${v.contre}" style="width:80px"></div>
              <div class="field"><label for="va${v.id}">Abstention</label><input id="va${v.id}" type="number" min="0" value="${v.abst}" style="width:80px"></div>
              <button class="btn btn-primary" data-vclose="${v.id}">Clore le vote</button>
            </div>
            <p style="font-size:12px;color:var(--ink-3);margin:8px 0 0">Saisie par le secrétaire (main levée) — la version réelle permettrait aussi le vote sur smartphone de chaque membre, avec anonymat configurable.</p>`
          : bar(v)}
      </div>
    </div>`).join('')}
    ${r.statut !== 'terminee' ? `
    <div class="card">
      <h3>Nouvelle résolution</h3>
      <div style="display:flex;gap:8px">
        <input id="vNew" placeholder="ex. Augmentation du budget arbitrage de 10 %" style="flex:1">
        <button class="btn" id="vAdd">Ajouter</button>
      </div>
    </div>` : ''}
  </div>`;
}

function reunionCR(r) {
  const faits = r.odj.filter(o => o.fait);
  const quorumMin = Math.ceil(r.convoquees * r.quorumPct / 100);
  return `
  <div class="card" style="max-width:760px">
    <h3>Compte-rendu ${r.statut === 'terminee' ? '' : '(brouillon généré)'}</h3>
    <div style="font-size:13.5px;line-height:1.65">
      <p><strong>${esc(r.titre)}</strong> — ${dfr(r.date)} à ${r.heure}, ${esc(r.lieu)}.</p>
      <p>${r.statut === 'terminee'
        ? `Présents : ${r.presents}${r.pouvoirs ? ` · Pouvoirs : ${r.pouvoirs}` : ''} · Quorum requis : ${quorumMin} — atteint.`
        : `Réunion à venir : le compte-rendu se remplira automatiquement à partir du déroulé de séance et des votes.`}</p>
      ${faits.length ? '<ol style="padding-left:20px;margin:8px 0">' + faits.map(o => `<li style="margin-bottom:6px"><strong>${esc(o.titre)}.</strong> ${esc(o.note || 'Point traité.')}</li>`).join('') + '</ol>' : ''}
      ${r.votes.filter(v => v.statut === 'clos').length ? `
        <p><strong>Résolutions soumises au vote :</strong></p>
        <ul style="padding-left:20px;margin:8px 0">
        ${r.votes.filter(v => v.statut === 'clos').map(v => `<li style="margin-bottom:4px">${esc(v.titre)} — <strong>${v.resultat === 'adopte' ? 'adoptée' : 'rejetée'}</strong> (${v.pour} pour, ${v.contre} contre, ${v.abst} abst.)</li>`).join('')}
        </ul>` : ''}
      <p style="color:var(--ink-3)">Le secrétaire : A. Peyre · Le président : J.-M. Fabre</p>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" id="btnCrPdf">Exporter en PDF (simulé)</button>
      <button class="btn" id="btnCrMail">Diffuser aux membres (simulé)</button>
    </div>
  </div>`;
}

function openFormReunion() {
  openModal('Planifier une réunion', `
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label for="rTitre">Titre</label><input id="rTitre" placeholder="ex. Comité directeur de novembre"></div>
      <div class="field"><label for="rType">Type</label><select id="rType"><option value="Codir">Comité directeur</option><option value="AG">Assemblée générale</option></select></div>
      <div class="field"><label for="rLieu">Lieu</label><input id="rLieu" value="Club house"></div>
      <div class="field"><label for="rDate">Date</label><input id="rDate" type="date" value="${addDaysIso(TODAY, 30)}"></div>
      <div class="field"><label for="rHeure">Heure</label><input id="rHeure" type="time" value="20:30"></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="rSave">Créer</button>`);
  $('#rSave').onclick = () => {
    const titre = $('#rTitre').value.trim();
    if (!titre) { toast('Le titre est obligatoire.'); return; }
    const type = $('#rType').value;
    const reu = { id: Date.now(), type, titre, date: $('#rDate').value, heure: $('#rHeure').value, lieu: $('#rLieu').value.trim() || 'Club house',
      statut: 'preparation', convoquees: type === 'AG' ? state.licencies.length : state.bureau.length, presents: 0, pouvoirs: 0,
      quorumPct: type === 'AG' ? 25 : 50, convocEnvoyee: false, odj: [], votes: [], docs: [], presence: {} };
    state.reunions.push(reu);
    subTabs.codirOpen = reu.id; subTabs.codirTab = 'preparation';
    toast(`Réunion « ${titre} » créée.`);
    closeModal(); render();
  };
}
</script>
<script>
/* ================= LIAISON DES ÉVÉNEMENTS & DÉMARRAGE ================= */

function bindView() {
  const v = $('#view');
  bindChartTips(v);
  // Tableau de bord
  $$('[data-goto]', v).forEach(b => b.onclick = () => { state.view = b.dataset.goto; render(); });

  // Licenciés
  const licQ = $('#licQ');
  if (licQ) {
    licQ.oninput = () => { state.filtres.lic.q = licQ.value; render(); const el = $('#licQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
    $('#licCat').onchange = e => { state.filtres.lic.cat = e.target.value; render(); };
    $('#licCot').onchange = e => { state.filtres.lic.cot = e.target.value; render(); };
    $('#licCert').onchange = e => { state.filtres.lic.cert = e.target.value; render(); };
    $('#btnNewLic').onclick = () => openFormLic(null);
    $('#btnExportLic').onclick = () => toast('Export CSV généré (simulé dans la maquette).');
    $$('[data-lic]', v).forEach(tr => {
      const open = () => openFicheLic(Number(tr.dataset.lic));
      tr.onclick = open;
      tr.onkeydown = e => { if (e.key === 'Enter') open(); };
    });
  }

  // Comptabilité
  $$('[data-ctab]', v).forEach(b => b.onclick = () => { subTabs.compta = b.dataset.ctab; render(); });
  const btnEc = $('#btnNewEcriture'); if (btnEc) btnEc.onclick = openFormEcriture;
  const btnSync = $('#btnSync'); if (btnSync) btnSync.onclick = () => { syncBanque(); render(); };
  const bqS = $('#bqStatut'); if (bqS) bqS.onchange = e => { state.filtres.banque.statut = e.target.value; render(); };
  $$('[data-rappro]', v).forEach(b => b.onclick = () => { rapprocher(Number(b.dataset.rappro)); render(); });
  const btnNewPay = $('#btnNewPay'); if (btnNewPay) btnNewPay.onclick = openFormPaiement;
  const btnRelAll = $('#btnRelanceAll');
  if (btnRelAll) btnRelAll.onclick = () => {
    let n = 0;
    for (const p of state.paiements) if (p.statut !== 'paye') { p.statut = 'relancee'; p.relances++; n++; }
    toast(n ? `${n} relance(s) envoyée(s) par email (simulé).` : 'Aucun impayé à relancer.');
    render();
  };
  $$('[data-relance]', v).forEach(b => b.onclick = () => {
    const p = state.paiements.find(x => x.id === Number(b.dataset.relance));
    if (p) { p.statut = 'relancee'; p.relances++; toast('Relance envoyée (simulé).'); render(); }
  });
  $$('[data-simulpay]', v).forEach(b => b.onclick = () => { simulerPaiement(Number(b.dataset.simulpay)); render(); });

  // Stock
  $$('[data-pole]', v).forEach(b => b.onclick = () => { subTabs.stockPole = b.dataset.pole; render(); });
  const stA = $('#stAlerte'); if (stA) stA.onchange = e => { state.filtres.stock.alerte = e.target.checked; render(); };
  $$('[data-mv]', v).forEach(b => b.onclick = () => openMouvement(Number(b.dataset.art), b.dataset.mv));
  const btnHisto = $('#btnHistoStock'); if (btnHisto) btnHisto.onclick = openHistoStock;
  const btnArt = $('#btnNewArt'); if (btnArt) btnArt.onclick = openFormArticle;

  // Codir
  const btnReu = $('#btnNewReu'); if (btnReu) btnReu.onclick = openFormReunion;
  $$('[data-reu]', v).forEach(tr => {
    const open = () => { subTabs.codirOpen = Number(tr.dataset.reu); subTabs.codirTab = 'preparation'; render(); };
    tr.onclick = open;
    tr.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
  const back = $('#btnBackReu'); if (back) back.onclick = () => { subTabs.codirOpen = null; render(); };
  $$('[data-rtab]', v).forEach(b => b.onclick = () => { subTabs.codirTab = b.dataset.rtab; render(); });

  const r = subTabs.codirOpen ? state.reunions.find(x => x.id === subTabs.codirOpen) : null;
  if (r) {
    const odjAdd = $('#odjAdd');
    if (odjAdd) odjAdd.onclick = () => {
      const inp = $('#odjNew');
      if (!inp.value.trim()) return;
      r.odj.push({ id: Date.now(), titre: inp.value.trim(), note: '', fait: false });
      toast('Point ajouté à l\'ordre du jour.');
      render();
    };
    $$('[data-delodj]', v).forEach(b => b.onclick = () => { r.odj = r.odj.filter(o => o.id !== Number(b.dataset.delodj)); render(); });
    const btnConvoc = $('#btnConvoc');
    if (btnConvoc) btnConvoc.onclick = () => { r.convocEnvoyee = true; toast(`Convocations envoyées à ${r.convoquees} membre(s) par email (simulé).`); render(); };
    const btnDoc = $('#btnDocAdd');
    if (btnDoc) btnDoc.onclick = () => { r.docs.push('Document ' + (r.docs.length + 1) + '.pdf'); toast('Document joint (simulé).'); render(); };
    $$('[data-pres]', v).forEach(c => c.onchange = () => { r.presence[c.dataset.pres] = c.checked; render(); });
    $$('[data-fait]', v).forEach(c => c.onchange = () => {
      const o = r.odj.find(x => x.id === Number(c.dataset.fait));
      if (o) o.fait = c.checked;
      render();
    });
    $$('[data-note-for]', v).forEach(inp => inp.onchange = () => {
      const o = r.odj.find(x => x.id === Number(inp.dataset.noteFor));
      if (o) { o.note = inp.value; toast('Note enregistrée.'); }
    });
    $$('[data-vopen]', v).forEach(b => b.onclick = () => {
      const vt = r.votes.find(x => x.id === Number(b.dataset.vopen));
      if (vt) { vt.statut = 'ouvert'; if (r.statut === 'preparation') r.statut = 'en_cours'; toast('Vote ouvert.'); render(); }
    });
    $$('[data-vclose]', v).forEach(b => b.onclick = () => {
      const vt = r.votes.find(x => x.id === Number(b.dataset.vclose));
      if (!vt) return;
      vt.pour = Math.max(0, Number($('#vp' + vt.id).value) || 0);
      vt.contre = Math.max(0, Number($('#vc' + vt.id).value) || 0);
      vt.abst = Math.max(0, Number($('#va' + vt.id).value) || 0);
      if (!vt.pour && !vt.contre && !vt.abst) { toast('Saisis au moins un vote avant de clore.'); return; }
      vt.statut = 'clos';
      vt.resultat = vt.pour > vt.contre ? 'adopte' : 'rejete';
      toast(`Vote clos — résolution ${vt.resultat === 'adopte' ? 'adoptée' : 'rejetée'}.`);
      render();
    });
    const vAdd = $('#vAdd');
    if (vAdd) vAdd.onclick = () => {
      const inp = $('#vNew');
      if (!inp.value.trim()) return;
      r.votes.push({ id: Date.now(), titre: inp.value.trim(), mode: r.type, statut: 'a_ouvrir', pour: 0, contre: 0, abst: 0, resultat: null });
      toast('Résolution ajoutée.');
      render();
    };
    const crPdf = $('#btnCrPdf'); if (crPdf) crPdf.onclick = () => toast('PDF du compte-rendu généré (simulé).');
    const crMail = $('#btnCrMail'); if (crMail) crMail.onclick = () => toast('Compte-rendu diffusé aux membres (simulé).');
  }
}

render();
</script>

</body>
</html>
