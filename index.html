<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ovalie Gestion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --surface-2: #eef1ed;
  --ink: #182019;
  --ink-2: #5a635c;
  --ink-3: #8b938d;
  --line: #e2e6e1;
  --line-strong: #c9cfc9;
  --accent: #1e5c42;
  --accent-ink: #ffffff;
  --accent-soft: #e3efe8;
  --side-bg: #14241c;
  --side-ink: #cfdad2;
  --side-ink-strong: #ffffff;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --warning-text: #8a5b00;
  --serious: #ec835a;
  --serious-text: #a34312;
  --critical: #d03b3b;
  --critical-text: #b02a2a;
  --chart-s1: #2a78d6;
  --chart-s2: #eb6834;
  --chart-s3: #1baf7a;
  --chart-grid: #e1e0d9;
  --chart-axis: #c3c2b7;
  --shadow: 0 1px 2px rgba(20,30,24,.06), 0 4px 14px rgba(20,30,24,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101412;
    --surface: #191f1b;
    --surface-2: #212823;
    --ink: #e7ece8;
    --ink-2: #a6afa8;
    --ink-3: #79827b;
    --line: #2a322c;
    --line-strong: #3b453e;
    --accent: #4fae83;
    --accent-ink: #0c1810;
    --accent-soft: #1d2f26;
    --side-bg: #0c120e;
    --side-ink: #9fada4;
    --side-ink-strong: #ffffff;
    --good: #0ca30c;
    --good-text: #4cc06a;
    --warning: #fab219;
    --warning-text: #e3b95c;
    --serious: #ec835a;
    --serious-text: #eb9a78;
    --critical: #d03b3b;
    --critical-text: #e66767;
    --chart-s1: #3987e5;
    --chart-s2: #d95926;
    --chart-s3: #199e70;
    --chart-grid: #2c2c2a;
    --chart-axis: #383835;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #101412;
  --surface: #191f1b;
  --surface-2: #212823;
  --ink: #e7ece8;
  --ink-2: #a6afa8;
  --ink-3: #79827b;
  --line: #2a322c;
  --line-strong: #3b453e;
  --accent: #4fae83;
  --accent-ink: #0c1810;
  --accent-soft: #1d2f26;
  --side-bg: #0c120e;
  --side-ink: #9fada4;
  --side-ink-strong: #ffffff;
  --good: #0ca30c;
  --good-text: #4cc06a;
  --warning: #fab219;
  --warning-text: #e3b95c;
  --serious: #ec835a;
  --serious-text: #eb9a78;
  --critical: #d03b3b;
  --critical-text: #e66767;
  --chart-s1: #3987e5;
  --chart-s2: #d95926;
  --chart-s3: #199e70;
  --chart-grid: #2c2c2a;
  --chart-axis: #383835;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1,h2,h3,h4 { text-wrap: balance; }

.app { display: flex; min-height: 100%; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 216px; flex: none;
  background: var(--side-bg); color: var(--side-ink);
  display: flex; flex-direction: column;
  padding: 18px 12px calc(14px + env(safe-area-inset-bottom, 0px));
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand-badge {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
}
.brand-name {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 20px; letter-spacing: .4px; color: var(--side-ink-strong);
  line-height: 1.05;
}
.brand-sub { font-size: 11px; color: var(--side-ink); letter-spacing: .3px; }
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 0; color: var(--side-ink);
  font: 500 14px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%;
}
.nav button:hover { background: rgba(255,255,255,.07); color: var(--side-ink-strong); }
.nav button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav button:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.nav .ico { width: 18px; flex: none; text-align: center; }
.side-note {
  margin-top: auto; font-size: 11px; line-height: 1.45; color: var(--side-ink);
  border-top: 1px solid rgba(255,255,255,.12); padding: 12px 8px 0;
}

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; padding: 0 24px 40px; }
.demo-banner {
  background: var(--warning); color: #221800;
  font-size: 12.5px; font-weight: 600; letter-spacing: .2px;
  padding: 6px 24px; margin: 0 -24px;
  display: flex; gap: 8px; align-items: center;
}
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 0 6px; }
.page-title {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 30px; letter-spacing: .3px; margin: 0; line-height: 1;
}
.page-sub { color: var(--ink-2); margin: 4px 0 0; font-size: 13px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Cards & grids ---------- */
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; box-shadow: var(--shadow);
}
.card h3 {
  margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--ink-2); font-weight: 600;
}
.kpi-value {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-size: 32px; font-weight: 600; line-height: 1;
}
.kpi-note { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.two-col { grid-template-columns: 3fr 2fr; margin-top: 14px; align-items: start; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
  color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line-strong);
  white-space: nowrap;
}
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.rowlink { cursor: pointer; }
tr.rowlink:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { color: var(--ink-3); font-style: italic; padding: 18px 10px; }

/* ---------- Badges & status ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .2px;
  padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.b-good { color: var(--good-text); background: color-mix(in srgb, var(--good) 12%, var(--surface)); border-color: color-mix(in srgb, var(--good) 30%, var(--line)); }
.b-warn { color: var(--warning-text); background: color-mix(in srgb, var(--warning) 14%, var(--surface)); border-color: color-mix(in srgb, var(--warning) 35%, var(--line)); }
.b-serious { color: var(--serious-text); background: color-mix(in srgb, var(--serious) 13%, var(--surface)); border-color: color-mix(in srgb, var(--serious) 32%, var(--line)); }
.b-crit { color: var(--critical-text); background: color-mix(in srgb, var(--critical) 11%, var(--surface)); border-color: color-mix(in srgb, var(--critical) 30%, var(--line)); }
.b-info { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }

/* ---------- Buttons & forms ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 8px 13px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn-sm { padding: 5px 9px; font-size: 12px; }
.btn-danger { color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 40%, var(--line-strong)); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
input, select, textarea {
  font: 13.5px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px;
}
input::placeholder { color: var(--ink-3); }
label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: block; margin-bottom: 4px; }
.field { display: flex; flex-direction: column; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

/* ---------- Toolbar / filters ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 12px; }
.toolbar input[type="search"] { min-width: 200px; flex: 1 1 200px; max-width: 320px; }
.count-note { color: var(--ink-2); font-size: 12.5px; margin-left: auto; white-space: nowrap; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-strong); margin: 14px 0 0; overflow-x: auto; }
.tabs button {
  border: 0; background: none; cursor: pointer;
  font: 600 13.5px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink-2); padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  white-space: nowrap;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-body { padding-top: 14px; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(10,14,11,.55);
  display: grid; place-items: center; padding: 20px; z-index: 50;
}
.modal {
  background: var(--surface); color: var(--ink);
  border-radius: 12px; border: 1px solid var(--line);
  width: min(720px, 100%); max-height: min(86vh, 100%); overflow: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--surface); z-index: 2;
}
.modal-head h2 {
  margin: 0; font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: .3px;
}
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
.x-btn { border: 0; background: none; color: var(--ink-2); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px 8px; }
.x-btn:hover { color: var(--ink); }

/* ---------- Toast ---------- */
.toast-zone { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(420px, calc(100% - 32px)); }
.toast {
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow); max-width: 100%;
  animation: toast-in .18s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* ---------- Charts ---------- */
.chart-tip {
  position: fixed; z-index: 80; pointer-events: none;
  background: var(--ink); color: var(--bg);
  font-size: 12px; padding: 6px 9px; border-radius: 6px; line-height: 1.45;
  max-width: 240px;
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hbar-row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.hbar-track { background: var(--surface-2); border-radius: 4px; height: 14px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--chart-s1); }
.hbar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* ---------- Alerts list ---------- */
.alert-line { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.alert-line:last-child { border-bottom: 0; }
.alert-line .when { margin-left: auto; color: var(--ink-3); font-size: 12px; white-space: nowrap; }

/* ---------- Stock gauge ---------- */
.gauge { background: var(--surface-2); border-radius: 4px; height: 10px; min-width: 90px; overflow: hidden; position: relative; }
.gauge > i { display: block; height: 100%; background: var(--good); }
.gauge.low > i { background: var(--critical); }
.gauge.mid > i { background: var(--warning); }

/* ---------- Vote bars ---------- */
.vote-bar { display: flex; height: 16px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.vote-bar > i { display: block; height: 100%; }
.vote-bar > i + i { margin-left: 2px; }
.vote-pour { background: var(--good); }
.vote-contre { background: var(--critical); }
.vote-abst { background: var(--chart-axis); }

/* ---------- Meeting layout ---------- */
.odj-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.odj-item:last-child { border-bottom: 0; }
.odj-num {
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  font-weight: 700; font-size: 16px; color: var(--accent); flex: none; width: 24px; padding-top: 1px;
}
.presence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.presence-grid label {
  display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; margin: 0;
}
.presence-grid label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- Responsive ---------- */
@media (max-width: 760px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; flex-wrap: wrap; gap: 4px; padding: 10px 12px; }
  .brand { padding: 0 6px 0 0; }
  .nav { flex-direction: row; flex-wrap: wrap; margin: 0; }
  .nav button { padding: 7px 9px; }
  .side-note { display: none; }
  .main { padding: 0 16px 32px; }
  .demo-banner { margin: 0 -16px; padding: 6px 16px; }
  .hbar-row { grid-template-columns: 96px 1fr 60px; }
}
</style>
</head>
<body>


<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><ellipse cx="10" cy="10" rx="8.5" ry="5.6" transform="rotate(-32 10 10)" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M6.5 12.5 L13.5 7.5 M9 12.8 L9.6 11 M11 11.4 L11.6 9.6 M8 10.4 L8.6 8.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </div>

        <div class="brand-name">Ovalie Gestion</div>

  <main class="main">

    <div id="view"></div>
  </main>
</div>

<div id="modalRoot" hidden></div>
<div class="toast-zone" id="toastZone" aria-live="polite"></div>
<div class="chart-tip" id="chartTip" hidden></div>

<script>
/* ================= UTILITAIRES ================= */
'use strict';
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => n.toLocaleString('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits: Number.isInteger(n) ? 0 : 2});
const dfr = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'}); };
const dfrShort = iso => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}); };
const TODAY = '2026-09-18';
const daysUntil = iso => Math.round((new Date(iso) - new Date(TODAY)) / 86400000);
const addDaysIso = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };

/* RNG déterministe : mêmes données à chaque ouverture */
let _seed = 20262027;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

function toast(msg) {
  const z = $('#toastZone');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  z.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openModal(title, bodyHtml, footHtml) {
  const root = $('#modalRoot');
  root.hidden = false;
  root.innerHTML = `<div class="modal-back" id="modalBack">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h2>${esc(title)}</h2><button class="x-btn" id="modalClose" aria-label="Fermer">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}
    </div></div>`;
  $('#modalClose').onclick = closeModal;
  $('#modalBack').addEventListener('mousedown', e => { if (e.target.id === 'modalBack') closeModal(); });
}
function closeModal() { const r = $('#modalRoot'); r.hidden = true; r.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* Tooltip graphiques */
const tip = $('#chartTip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.hidden = false;
  const pad = 12;
  requestAnimationFrame(() => {
    const r = tip.getBoundingClientRect();
    let left = x + pad, top = y - r.height - pad;
    if (left + r.width > innerWidth - 8) left = x - r.width - pad;
    if (top < 8) top = y + pad;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  });
}
function hideTip() { tip.hidden = true; }
</script>
<script>
/* ================= DONNÉES DE TEST GÉNÉRÉES ================= */

(function genLicencies() {
  let id = 1;
  for (const cat of CATEGORIES) {
    for (let i = 0; i < cat.n; i++) {
      const estF = cat.mixte ? rnd() < 0.3 : rnd() < 0.06;
      const prenom = estF ? pick(PRENOMS_F) : pick(PRENOMS_M);
      const nom = pick(NOMS);
      const annee = ri(cat.nmin, cat.nmax);
      const naissance = `${annee}-${String(ri(1,12)).padStart(2,'0')}-${String(ri(1,28)).padStart(2,'0')}`;
      // Certificat médical / attestation : validité 3 ans, certains expirés ou proches
      const r = rnd();
      let certFin;
      if (r < 0.08) certFin = addDaysIso(TODAY, -ri(10, 120));        // expiré
      else if (r < 0.20) certFin = addDaysIso(TODAY, ri(5, 60));      // expire bientôt
      else certFin = addDaysIso(TODAY, ri(90, 900));
      const rl = rnd();
      const licStatut = rl < 0.72 ? 'validee' : (rl < 0.9 ? 'attente' : 'a_renouveler');
      const rc = rnd();
      let cotStatut, cotPaye;
      if (cat.cot === 0) { cotStatut = 'exoneree'; cotPaye = 0; }
      else if (rc < 0.62) { cotStatut = 'payee'; cotPaye = cat.cot; }
      else if (rc < 0.78) { cotStatut = 'partielle'; cotPaye = Math.round(cat.cot / 2); }
      else { cotStatut = 'impayee'; cotPaye = 0; }
      state.licencies.push({
        id: id++, nom, prenom, sexe: estF ? 'F' : 'M', naissance,
        cat: cat.code,
        licence: '2026' + String(ri(100000, 999999)),
        licStatut, certFin,
        cot: cat.cot, cotPaye, cotStatut,
        email: `${prenom.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')}.${nom.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')}@exemple.fr`,
        tel: `06 ${String(ri(10,99))} ${String(ri(10,99))} ${String(ri(10,99))} ${String(ri(10,99))}`,
        ville: pick(VILLES),
        inscrit: 2026 - ri(0, 8),
      });
    }
  }
})();

<script>

];

function renderNav() {
  $('#mainNav').innerHTML = MODULES.map(m =>
    `<button class="${state.view === m.id ? 'active' : ''}" data-nav="${m.id}"><span class="ico" aria-hidden="true">${m.ico}</span>${m.label}</button>`).join('');
  $$('#mainNav [data-nav]').forEach(b => b.onclick = () => { state.view = b.dataset.nav; render(); });
}

function render() {
  renderNav();
  const v = $('#view');
  if (state.view === 'dashboard') v.innerHTML = viewDashboard();
  else if (state.view === 'licencies') v.innerHTML = viewLicencies();
  else if (state.view === 'compta') v.innerHTML = viewCompta();

}[s] || esc(s));
const cotBadge = s => ({
  payee: '<span class="badge b-good"><span class="dot"></span>Payée</span>',
  partielle: '<span class="badge b-warn"><span class="dot"></span>Partielle</span>',
  impayee: '<span class="badge b-crit"><span class="dot"></span>Impayée</span>',
  exoneree: '<span class="badge">Exonérée</span>',
}[s] || esc(s));
function certBadge(l) {
  const d = daysUntil(l.certFin);
  if (d < 0) return `<span class="badge b-crit"><span class="dot"></span>Expiré (${dfrShort(l.certFin)})</span>`;
  if (d <= 60) return `<span class="badge b-warn"><span class="dot"></span>Expire dans ${d} j</span>`;
  return `<span class="badge b-good"><span class="dot"></span>Valide → ${dfrShort(l.certFin)}</span>`;
}

function soldeCourant() {
  const r = state.ecritures.reduce((s, e) => s + (e.sens === 'R' ? e.montant : -e.montant), 0);
  return state.soldeInitial + r;
}
function alertesStock() {
  const sousSeuil = state.stock.filter(a => a.qte <= a.seuil);
  const perimes = state.stock.filter(a => a.peremption && daysUntil(a.peremption) <= 60);
  return { sousSeuil, perimes };
}
