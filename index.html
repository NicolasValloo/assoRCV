}

function reunionSeance(r) {
  const presents = Object.values(r.presence).filter(Boolean).length;
  const quorumMin = Math.ceil(r.convoquees * r.quorumPct / 100);
  const quorumOk = (r.statut === 'terminee' ? r.presents + r.pouvoirs : presents) >= quorumMin;
  return `
  <div class="grid two-col">
    <div class="card">
      <h3>Déroulé de la séance</h3>
      ${r.odj.map((o, i) => `<div class="odj-item">
        <span class="odj-num">${i + 1}.</span>
        <div style="min-width:0;flex:1">
          <strong>${esc(o.titre)}</strong>
          ${o.note ? `<br><span style="color:var(--ink-2);font-size:12.5px">${esc(o.note)}</span>` : ''}
          ${r.statut !== 'terminee' ? `<div style="margin-top:6px"><input data-note-for="${o.id}" placeholder="Décision / note de séance…" value="${esc(o.note)}" style="width:100%"></div>` : ''}
        </div>
        <label style="margin:0;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap">
          <input type="checkbox" data-fait="${o.id}" ${o.fait ? 'checked' : ''} ${r.statut === 'terminee' ? 'disabled' : ''}> traité</label>
      </div>`).join('')}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>Quorum</h3>
        ${r.statut === 'terminee'
          ? `<p style="margin:0"><strong>${r.presents} présents</strong>${r.pouvoirs ? ` + ${r.pouvoirs} pouvoirs` : ''} sur ${r.convoquees} convoqués.<br>
             <span class="badge ${quorumOk ? 'b-good' : 'b-crit'}" style="margin-top:6px"><span class="dot"></span>Quorum ${quorumOk ? 'atteint' : 'non atteint'} (min. ${quorumMin})</span></p>`
          : `<p style="margin:0 0 8px"><strong>${presents}</strong> présent(s) émargés · quorum : ${quorumMin} (${r.quorumPct} %)
             <span class="badge ${quorumOk ? 'b-good' : 'b-warn'}" style="margin-left:6px"><span class="dot"></span>${quorumOk ? 'Atteint' : 'Pas encore atteint'}</span></p>`}
      </div>
      ${r.type !== 'AG' ? `<div class="card">
        <h3>Émargement</h3>
        <div class="presence-grid">
          ${state.bureau.map(m => `<label><input type="checkbox" data-pres="${m.id}" ${r.presence[m.id] ? 'checked' : ''} ${r.statut === 'terminee' ? 'disabled' : ''}> ${esc(m.nom)}</label>`).join('')}
        </div>
      </div>` : `<div class="card"><h3>Émargement AG</h3><p style="margin:0;font-size:13px;color:var(--ink-2)">${r.statut === 'terminee' ? `Feuille d'émargement archivée : ${r.presents} signatures + ${r.pouvoirs} pouvoirs.` : 'L\'émargement des adhérents se fait à l\'entrée (liste imprimée ou tablette).'}</p></div>`}
    </div>
  </div>`;
}

function reunionVotes(r) {
  const totalVotants = r.type === 'AG' ? (r.presents + r.pouvoirs || 54) : Math.max(Object.values(r.presence).filter(Boolean).length, r.presents) || state.bureau.length;
  const bar = v => {
    const tot = v.pour + v.contre + v.abst || 1;
    return `<div class="vote-bar" role="img" aria-label="Pour ${v.pour}, contre ${v.contre}, abstentions ${v.abst}">
      <i class="vote-pour" style="width:${v.pour / tot * 100}%"></i>
      <i class="vote-contre" style="width:${v.contre / tot * 100}%"></i>
      <i class="vote-abst" style="width:${v.abst / tot * 100}%"></i>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><span class="sw" style="background:var(--good)"></span>Pour : ${v.pour}</span>
      <span><span class="sw" style="background:var(--critical)"></span>Contre : ${v.contre}</span>
      <span><span class="sw" style="background:var(--chart-axis)"></span>Abst. : ${v.abst}</span>
    </div>`;
  };
  return `
  <div class="grid" style="grid-template-columns:1fr;max-width:760px">
    ${r.votes.map(v => `<div class="card">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
        <strong style="flex:1;min-width:200px">${esc(v.titre)}</strong>
        ${v.statut === 'clos'
          ? (v.resultat === 'adopte' ? '<span class="badge b-good"><span class="dot"></span>Adoptée</span>' : '<span class="badge b-crit"><span class="dot"></span>Rejetée</span>')
          : v.statut === 'ouvert' ? '<span class="badge b-warn"><span class="dot"></span>Vote en cours</span>' : '<span class="badge"><span class="dot"></span>À ouvrir</span>'}
      </div>
      <div style="margin-top:10px">
        ${v.statut === 'a_ouvrir'
          ? `<p style="font-size:13px;color:var(--ink-2);margin:0 0 10px">Le vote sera ouvert en séance. Votants attendus : ${totalVotants}.</p>
             ${r.statut !== 'terminee' ? `<button class="btn btn-primary btn-sm" data-vopen="${v.id}">Ouvrir le vote</button>` : ''}`
          : v.statut === 'ouvert'
          ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
              <div class="field"><label for="vp${v.id}">Pour</label><input id="vp${v.id}" type="number" min="0" value="${v.pour}" style="width:80px"></div>
              <div class="field"><label for="vc${v.id}">Contre</label><input id="vc${v.id}" type="number" min="0" value="${v.contre}" style="width:80px"></div>
              <div class="field"><label for="va${v.id}">Abstention</label><input id="va${v.id}" type="number" min="0" value="${v.abst}" style="width:80px"></div>
              <button class="btn btn-primary" data-vclose="${v.id}">Clore le vote</button>
            </div>
            <p style="font-size:12px;color:var(--ink-3);margin:8px 0 0">Saisie par le secrétaire (main levée) — la version réelle permettrait aussi le vote sur smartphone de chaque membre, avec anonymat configurable.</p>`
          : bar(v)}
      </div>
    </div>`).join('')}
    ${r.statut !== 'terminee' ? `
    <div class="card">
      <h3>Nouvelle résolution</h3>
      <div style="display:flex;gap:8px">
        <input id="vNew" placeholder="ex. Augmentation du budget arbitrage de 10 %" style="flex:1">
        <button class="btn" id="vAdd">Ajouter</button>
      </div>
    </div>` : ''}
  </div>`;
}

function reunionCR(r) {
  const faits = r.odj.filter(o => o.fait);
  const quorumMin = Math.ceil(r.convoquees * r.quorumPct / 100);
  return `
  <div class="card" style="max-width:760px">
    <h3>Compte-rendu ${r.statut === 'terminee' ? '' : '(brouillon généré)'}</h3>
    <div style="font-size:13.5px;line-height:1.65">
      <p><strong>${esc(r.titre)}</strong> — ${dfr(r.date)} à ${r.heure}, ${esc(r.lieu)}.</p>
      <p>${r.statut === 'terminee'
        ? `Présents : ${r.presents}${r.pouvoirs ? ` · Pouvoirs : ${r.pouvoirs}` : ''} · Quorum requis : ${quorumMin} — atteint.`
        : `Réunion à venir : le compte-rendu se remplira automatiquement à partir du déroulé de séance et des votes.`}</p>
      ${faits.length ? '<ol style="padding-left:20px;margin:8px 0">' + faits.map(o => `<li style="margin-bottom:6px"><strong>${esc(o.titre)}.</strong> ${esc(o.note || 'Point traité.')}</li>`).join('') + '</ol>' : ''}
      ${r.votes.filter(v => v.statut === 'clos').length ? `
        <p><strong>Résolutions soumises au vote :</strong></p>
        <ul style="padding-left:20px;margin:8px 0">
        ${r.votes.filter(v => v.statut === 'clos').map(v => `<li style="margin-bottom:4px">${esc(v.titre)} — <strong>${v.resultat === 'adopte' ? 'adoptée' : 'rejetée'}</strong> (${v.pour} pour, ${v.contre} contre, ${v.abst} abst.)</li>`).join('')}
        </ul>` : ''}
      <p style="color:var(--ink-3)">Le secrétaire : A. Peyre · Le président : A. Salini</p>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" id="btnCrPdf">Exporter en PDF (simulé)</button>
      <button class="btn" id="btnCrMail">Diffuser aux membres (simulé)</button>
    </div>
  </div>`;
}

function openFormReunion() {
  openModal('Planifier une réunion', `
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label for="rTitre">Titre</label><input id="rTitre" placeholder="ex. Comité directeur de novembre"></div>
      <div class="field"><label for="rType">Type</label><select id="rType"><option value="Codir">Comité directeur</option><option value="AG">Assemblée générale</option></select></div>
      <div class="field"><label for="rLieu">Lieu</label><input id="rLieu" value="Club house"></div>
      <div class="field"><label for="rDate">Date</label><input id="rDate" type="date" value="${addDaysIso(TODAY, 30)}"></div>
      <div class="field"><label for="rHeure">Heure</label><input id="rHeure" type="time" value="20:30"></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="rSave">Créer</button>`);
  $('#rSave').onclick = () => {
    const titre = $('#rTitre').value.trim();
    if (!titre) { toast('Le titre est obligatoire.'); return; }
    const type = $('#rType').value;
    const reu = { id: Date.now(), type, titre, date: $('#rDate').value, heure: $('#rHeure').value, lieu: $('#rLieu').value.trim() || 'Club house',
      statut: 'preparation', convoquees: type === 'AG' ? state.licencies.length : state.bureau.length, presents: 0, pouvoirs: 0,
      quorumPct: type === 'AG' ? state.params.quorumAG : state.params.quorumCodir, convocEnvoyee: false, odj: [], votes: [], docs: [], presence: {} };
    state.reunions.push(reu);
    subTabs.codirOpen = reu.id; subTabs.codirTab = 'preparation';
    toast(`Réunion « ${titre} » créée.`);
    closeModal(); render();
  };
}

<script>
/* ================= LIAISON DES ÉVÉNEMENTS & DÉMARRAGE ================= */

function bindView() {
  const v = $('#view');
  bindChartTips(v);
  if (window.bindExtra) bindExtra(v);
  // Tableau de bord
  $$('[data-goto]', v).forEach(b => b.onclick = () => { state.view = b.dataset.goto; render(); });

  // Licenciés
  const licQ = $('#licQ');
  if (licQ) {
    licQ.oninput = () => { state.filtres.lic.q = licQ.value; render(); const el = $('#licQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
    $('#licCat').onchange = e => { state.filtres.lic.cat = e.target.value; render(); };
    $('#licCot').onchange = e => { state.filtres.lic.cot = e.target.value; render(); };
    $('#licCert').onchange = e => { state.filtres.lic.cert = e.target.value; render(); };
    $('#btnNewLic').onclick = () => openFormLic(null);
    $('#btnExportLic').onclick = () => toast('Export CSV généré (simulé dans la maquette).');
    $$('[data-lic]', v).forEach(tr => {
      const open = () => openFicheLic(Number(tr.dataset.lic));
      tr.onclick = open;
      tr.onkeydown = e => { if (e.key === 'Enter') open(); };
    });
  }

  // Comptabilité
  $$('[data-ctab]', v).forEach(b => b.onclick = () => { subTabs.compta = b.dataset.ctab; render(); });
  const btnEc = $('#btnNewEcriture'); if (btnEc) btnEc.onclick = openFormEcriture;
  const btnSync = $('#btnSync'); if (btnSync) btnSync.onclick = () => { syncBanque(); render(); };
  const bqS = $('#bqStatut'); if (bqS) bqS.onchange = e => { state.filtres.banque.statut = e.target.value; render(); };
  $$('[data-rappro]', v).forEach(b => b.onclick = () => { rapprocher(Number(b.dataset.rappro)); render(); });
  const btnNewPay = $('#btnNewPay'); if (btnNewPay) btnNewPay.onclick = openFormPaiement;
  const btnRelAll = $('#btnRelanceAll');
  if (btnRelAll) btnRelAll.onclick = () => {
    let n = 0;
    for (const p of state.paiements) if (p.statut !== 'paye') { p.statut = 'relancee'; p.relances++; n++; }
    toast(n ? `${n} relance(s) envoyée(s) par email (simulé).` : 'Aucun impayé à relancer.');
    render();
  };
  $$('[data-relance]', v).forEach(b => b.onclick = () => {
    const p = state.paiements.find(x => x.id === Number(b.dataset.relance));
    if (p) { p.statut = 'relancee'; p.relances++; toast('Relance envoyée (simulé).'); render(); }
  });
  $$('[data-simulpay]', v).forEach(b => b.onclick = () => { simulerPaiement(Number(b.dataset.simulpay)); render(); });

  // Stock
  $$('[data-pole]', v).forEach(b => b.onclick = () => { subTabs.stockPole = b.dataset.pole; render(); });
  const stA = $('#stAlerte'); if (stA) stA.onchange = e => { state.filtres.stock.alerte = e.target.checked; render(); };
  $$('[data-mv]', v).forEach(b => b.onclick = () => openMouvement(Number(b.dataset.art), b.dataset.mv));
  const btnHisto = $('#btnHistoStock'); if (btnHisto) btnHisto.onclick = openHistoStock;
  const btnArt = $('#btnNewArt'); if (btnArt) btnArt.onclick = openFormArticle;

  // Codir
  const btnReu = $('#btnNewReu'); if (btnReu) btnReu.onclick = openFormReunion;
  $$('[data-reu]', v).forEach(tr => {
    const open = () => { subTabs.codirOpen = Number(tr.dataset.reu); subTabs.codirTab = 'preparation'; render(); };
    tr.onclick = open;
    tr.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
  const back = $('#btnBackReu'); if (back) back.onclick = () => { subTabs.codirOpen = null; render(); };
  $$('[data-rtab]', v).forEach(b => b.onclick = () => { subTabs.codirTab = b.dataset.rtab; render(); });

  const r = subTabs.codirOpen ? state.reunions.find(x => x.id === subTabs.codirOpen) : null;
  if (r) {
    const odjAdd = $('#odjAdd');
    if (odjAdd) odjAdd.onclick = () => {
      const inp = $('#odjNew');
      if (!inp.value.trim()) return;
      r.odj.push({ id: Date.now(), titre: inp.value.trim(), note: '', fait: false });
      toast('Point ajouté à l\'ordre du jour.');
      render();
    };
    $$('[data-delodj]', v).forEach(b => b.onclick = () => { r.odj = r.odj.filter(o => o.id !== Number(b.dataset.delodj)); render(); });
    const btnConvoc = $('#btnConvoc');
    if (btnConvoc) btnConvoc.onclick = () => { r.convocEnvoyee = true; toast(`Convocations envoyées à ${r.convoquees} membre(s) par email (simulé).`); render(); };
    const btnDoc = $('#btnDocAdd');
    if (btnDoc) btnDoc.onclick = () => { r.docs.push('Document ' + (r.docs.length + 1) + '.pdf'); toast('Document joint (simulé).'); render(); };
    $$('[data-pres]', v).forEach(c => c.onchange = () => { r.presence[c.dataset.pres] = c.checked; render(); });
    $$('[data-fait]', v).forEach(c => c.onchange = () => {
      const o = r.odj.find(x => x.id === Number(c.dataset.fait));
      if (o) o.fait = c.checked;
      render();
    });
    $$('[data-note-for]', v).forEach(inp => inp.onchange = () => {
      const o = r.odj.find(x => x.id === Number(inp.dataset.noteFor));
      if (o) { o.note = inp.value; toast('Note enregistrée.'); }
    });
    $$('[data-vopen]', v).forEach(b => b.onclick = () => {
      const vt = r.votes.find(x => x.id === Number(b.dataset.vopen));
      if (vt) { vt.statut = 'ouvert'; if (r.statut === 'preparation') r.statut = 'en_cours'; toast('Vote ouvert.'); render(); }
    });
    $$('[data-vclose]', v).forEach(b => b.onclick = () => {
      const vt = r.votes.find(x => x.id === Number(b.dataset.vclose));
      if (!vt) return;
      vt.pour = Math.max(0, Number($('#vp' + vt.id).value) || 0);
      vt.contre = Math.max(0, Number($('#vc' + vt.id).value) || 0);
      vt.abst = Math.max(0, Number($('#va' + vt.id).value) || 0);
      if (!vt.pour && !vt.contre && !vt.abst) { toast('Saisis au moins un vote avant de clore.'); return; }
      vt.statut = 'clos';
      vt.resultat = vt.pour > vt.contre ? 'adopte' : 'rejete';
      toast(`Vote clos — résolution ${vt.resultat === 'adopte' ? 'adoptée' : 'rejetée'}.`);
      render();
    });
    const vAdd = $('#vAdd');
    if (vAdd) vAdd.onclick = () => {
      const inp = $('#vNew');
      if (!inp.value.trim()) return;
      r.votes.push({ id: Date.now(), titre: inp.value.trim(), mode: r.type, statut: 'a_ouvrir', pour: 0, contre: 0, abst: 0, resultat: null });
      toast('Résolution ajoutée.');
      render();
    };
    const crPdf = $('#btnCrPdf'); if (crPdf) crPdf.onclick = () => toast('PDF du compte-rendu généré (simulé).');
    const crMail = $('#btnCrMail'); if (crMail) crMail.onclick = () => toast('Compte-rendu diffusé aux membres (simulé).');
  }
}

render();

<script>
/* ================= V2 : THÈME CLUB (OPTION A), GED, PARAMÈTRES ================= */

/* ---- Couleur club : helpers + application (option A) ---- */
const _hx = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const _toHex = (r,g,b) => '#' + [r,g,b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join('');
const _lum = h => { const [r,g,b] = _hx(h).map(v => { v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*r + .7152*g + .0722*b; };
const _contrast = (a,b) => { const l1 = _lum(a), l2 = _lum(b); return (Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05); };
const _mix = (a,b,t) => { const A = _hx(a), B = _hx(b); return _toHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); };

function applyClubTheme() {
  const r = document.documentElement.style;
  let c = state.params.couleur || '#1e5c42';
  // Garde-fou : couleur trop claire pour porter du texte → assombrie automatiquement
  if (_contrast(c, '#ffffff') < 2.2 && _contrast(c, '#101410') < 4.5) c = _mix(c, '#000000', .35);
  const ink = _contrast(c, '#ffffff') >= 3 ? '#ffffff' : '#131813';
  r.setProperty('--accent', c);
  r.setProperty('--accent-ink', ink);
  r.setProperty('--accent-soft', _mix(c, '#ffffff', .88));
}

const BADGE_SVG = document.getElementById('brandBadge') ? document.getElementById('brandBadge').innerHTML : '';
function renderBrand() {
  const sub = $('#brandSub');
  if (sub) sub.textContent = `${state.params.clubNom} · ${state.params.clubSport}`;
  const badge = $('#brandBadge');
  if (badge) badge.innerHTML = state.params.logo
    ? `<img src="${state.params.logo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
    : BADGE_SVG;
}

/* ---- Droits : matrice par défaut ---- */
const ROLES = [
  { id:'president', label:'Président' },
  { id:'tresorier', label:'Trésorier' },
  { id:'secretaire', label:'Secrétaire' },

  return { id: _gid++, type:'file', nom, ext, taille, modif, par, partage, versions: vs };
};

const GED_ICO = { pdf:'📄', docx:'📝', xlsx:'📊', pptx:'📽️', png:'🖼️', jpg:'🖼️' };
function gedCwd() {
  let list = state.ged, node = null;
  for (const id of state.gedPath) {
    node = list.find(n => n.id === id && n.type === 'dir');
    if (!node) { state.gedPath = []; return { list: state.ged, chain: [] }; }
    list = node.children;
  }
  const chain = [];
  let l = state.ged;
  for (const id of state.gedPath) { const n = l.find(x => x.id === id); chain.push(n); l = n.children; }
  return { list, chain };
}
function gedFindAll(q, list = state.ged, path = []) {
  let out = [];
  for (const n of list) {
    if (n.nom.toLowerCase().includes(q)) out.push({ n, path });
    if (n.type === 'dir') out = out.concat(gedFindAll(q, n.children, [...path, n]));
  }
  return out;
}

      const open = () => {

  $$('[data-ptab]', v).forEach(b => b.onclick = () => { subTabs.param = b.dataset.ptab; render(); });

/* ================= V3.1 : VISIBILITÉ DES DOCUMENTS PAR RÔLE ================= */
/* Audiences que chaque rôle peut voir dans la GED (null = tout voir). */
const GED_AUDIENCES = {
  president: null,
  tresorier: null,
  secretaire: null,
  codir: ['Codir', 'Tous les membres'],
  educateur: ['Éducateurs', 'Tous les membres'],
  adherent: ['Tous les membres'],
};
function canSeeNode(n) {
  const allowed = GED_AUDIENCES[state.currentUser.roleId];
  if (allowed === null || allowed === undefined) return allowed === null; // null = accès total ; rôle inconnu = rien
  if (n.type === 'file') return (n.partage || []).some(p => allowed.includes(p));
  // Un dossier est visible si son partage l'autorise OU s'il contient au moins un élément visible
  return (n.partage || []).some(p => allowed.includes(p)) || (n.children || []).some(canSeeNode);
}
render();
</script>

          <label style="display:flex;gap:8px;align-items:center;margin:0;font-weight:500;color:var(--ink)"><input type="checkbox" class="prof-notif" checked> Alertes certificat médical</label>
          <label style="display:flex;gap:8px;align-items:center;margin:0;font-weight:500;color:var(--ink)"><input type="checkbox" class="prof-notif"> Actualités du club</label>
        </div>
        <p style="font-size:12px;color:var(--ink-3);margin:10px 0 0">Par email ; notifications push prévues avec l'application mobile.</p>
      </div>
      <div class="card">
        <h3>Sécurité & session</h3>
        <div class="alert-line"><span>💻 Cet appareil — navigateur web</span><span class="when">maintenant</span></div>
        <div class="alert-line"><span>📱 Téléphone Android</span><span class="when">hier, 19:42</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button class="btn btn-sm" id="profMdp">Changer de mot de passe (simulé)</button>
          <button class="btn btn-sm" id="profOut">Se déconnecter (simulé)</button>
        </div>
      </div>
    </div>
  </div>`;
}

const _bindExtraV31 = bindExtra;
bindExtra = function (v) {
  _bindExtraV31(v);
  const back = $('#profBack');
  if (back) {
    back.onclick = () => { state.view = state.prevView || (state.currentUser.roleId === 'adherent' ? 'mon-espace' : 'dashboard'); render(); };
    $('#profEdit').onclick = () => toast('Dans la version réelle : édition des coordonnées, soumise à validation du club pour les licenciés.');
    $('#profJoin').onclick = () => toast('Dans la version réelle : recherche du club et demande envoyée à son bureau pour validation.');
    $('#profMdp').onclick = () => toast('Changement de mot de passe simulé.');
    $('#profOut').onclick = () => toast('Déconnexion simulée — la maquette reste connectée.');
    $$('.prof-notif', v).forEach(c => c.onchange = () => toast('Préférence enregistrée (simulé).'));
  }
};

render();
</script>
<style>

<script>
/* ================= V4 : MODULE SPORTIF + DOCUMENTS EN CASES ================= */

/* ---- Données : calendrier sportif ---- */
const LIEUX = { dom: 'Stade municipal, Vincennes', ext1: 'Stade de Montclar', ext2: 'Complexe de Rochebrune', gym: 'Gymnase intercommunal' };
let _eid = 1;
const EVT = (type, cat, date, heure, lieu, extra = {}) => ({ id: _eid++, type, cat, date, heure, lieu, convoques: [], reponses: {}, presence: {}, resultat: null, ...extra });
state.events = [
  // Passé (résultats)
  EVT('match', 'SEN', '2026-09-06', '15:00', LIEUX.dom, { adversaire: 'RC Montclar', domicile: true, resultat: { nous: 24, eux: 13 } }),
  EVT('match', 'SEN', '2026-09-13', '15:00', LIEUX.ext2, { adversaire: 'US Rochebrune', domicile: false, resultat: { nous: 19, eux: 22 } }),
  EVT('match', 'M16', '2026-09-13', '10:30', LIEUX.dom, { adversaire: 'Entente Villeneuve', domicile: true, resultat: { nous: 31, eux: 10 } }),
  // À venir
  EVT('match', 'SEN', '2026-09-20', '15:00', LIEUX.dom, { adversaire: 'Stade Pontétois', domicile: true }),
  EVT('match', 'M16', '2026-09-20', '10:30', LIEUX.ext1, { adversaire: 'RC Montclar', domicile: false }),
  EVT('match', 'M19', '2026-09-27', '13:00', LIEUX.dom, { adversaire: 'US Rochebrune', domicile: true }),
  EVT('match', 'SEN', '2026-09-27', '15:00', LIEUX.ext1, { adversaire: 'RC Montclar', domicile: false }),
  EVT('tournoi', 'M10', '2026-10-04', '09:30', LIEUX.dom, { adversaire: 'Tournoi de rentrée EDR (M6→M12)' }),
  EVT('match', 'SEN', '2026-10-11', '15:00', LIEUX.dom, { adversaire: 'Ovalie Serrane', domicile: true }),
];
// Entraînements récurrents sur 2 semaines
(function genEntrainements() {
  const creneaux = [
    { cat:'M10', jours:[3], heure:'14:00', lieu: LIEUX.dom },       // mercredi
    { cat:'M14', jours:[3], heure:'16:00', lieu: LIEUX.dom },
    { cat:'M16', jours:[2,5], heure:'18:30', lieu: LIEUX.dom },     // mardi, vendredi
    { cat:'M19', jours:[2,5], heure:'19:00', lieu: LIEUX.dom },
    { cat:'SEN', jours:[2,4], heure:'19:30', lieu: LIEUX.dom },     // mardi, jeudi
    { cat:'LOI', jours:[4], heure:'20:00', lieu: LIEUX.gym },
  ];
  for (let j = 0; j < 15; j++) {
    const d = addDaysIso(TODAY, j);
    const dow = new Date(d + 'T12:00:00').getDay();
    for (const c of creneaux) if (c.jours.includes(dow)) state.events.push(EVT('entrainement', c.cat, d, c.heure, c.lieu));
  }
  state.events.sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));
})();
// Convocations pré-remplies pour les prochains matchs
(function genConvocs() {
  for (const e of state.events.filter(x => x.type === 'match' && !x.resultat && x.date <= addDaysIso(TODAY, 10))) {
    const pool = state.licencies.filter(l => l.cat === e.cat).slice(0, e.cat === 'SEN' ? 22 : 18);
    e.convoques = pool.map(l => l.id);
    for (const l of pool) { const r = rnd(); e.reponses[l.id] = r < 0.62 ? 'present' : r < 0.75 ? 'absent' : '?'; }
  }
})();

const EVT_TYPES = { match: ['Match', 'b-info'], entrainement: ['Entraînement', ''], tournoi: ['Tournoi', 'b-warn'] };
const CATS_SPORT = ['M6','M8','M10','M12','M14','M16','M19','SEN','LOI'];
subTabs.sportCat = ''; subTabs.sportOnglet = 'avenir';
const evtDateBlock = e => { const d = new Date(e.date + 'T12:00:00'); return `<div class="evt-date"><div class="wd">${d.toLocaleDateString('fr-FR',{weekday:'short'})}</div><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString('fr-FR',{month:'short'})}</div></div>`; };
const evtTitre = e => e.type === 'match' ? `${e.domicile ? state.params.clubNom + ' – ' + e.adversaire : e.adversaire + ' – ' + state.params.clubNom}` : e.type === 'tournoi' ? e.adversaire : 'Entraînement ' + catLabel(e.cat).replace(/ – .*/, '');
function monLicSportif() { const u = state.currentUser; const id = u.licId || u.enfantId; return id ? state.licencies.find(l => l.id === id) : null; }

function evtCard(e, opts = {}) {
  const [tl, tb] = EVT_TYPES[e.type];
  const lic = monLicSportif();
  const concerne = lic && lic.cat === e.cat;
  const rep = concerne ? (e.reponses[lic.id] || (e.type === 'entrainement' ? null : (e.convoques.includes(lic.id) ? '?' : null))) : null;
  const nbP = Object.values(e.reponses).filter(r => r === 'present').length;
  const nbA = Object.values(e.reponses).filter(r => r === 'absent').length;
  const ecrit = !window.canW || canW('sportif');
  const passe = e.date < TODAY;
  return `<div class="card evt-card">
    ${evtDateBlock(e)}
    <div class="evt-main">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="badge ${tb}">${tl}</span>
        <span class="badge">${esc(catLabel(e.cat).replace(/ – .*/, s => '').split(' – ')[0])}</span>
        ${e.type === 'match' ? `<span class="badge">${e.domicile ? 'Domicile' : 'Extérieur'}</span>` : ''}
      </div>
      <div class="evt-title" style="margin-top:6px">${esc(evtTitre(e))}</div>
      <div class="evt-meta">${e.heure} · ${esc(e.lieu)}${e.convoques.length ? ` · ${e.convoques.length} convoqué(s), ${nbP} présent(s)${nbA ? ', ' + nbA + ' absent(s)' : ''}` : ''}</div>
      ${concerne && !passe && (e.type !== 'match' || e.convoques.includes(lic.id)) ? `
      <div class="evt-actions">
        <button class="btn btn-sm ${rep === 'present' ? 'rsvp-ok' : ''}" data-rsvp="present" data-evt="${e.id}">✓ Présent${rep === 'present' ? ' (confirmé)' : ''}</button>
        <button class="btn btn-sm ${rep === 'absent' ? 'rsvp-ko' : ''}" data-rsvp="absent" data-evt="${e.id}">✕ Absent</button>
      </div>` : ''}
      ${ecrit && !opts.compact ? `<div class="evt-actions">
        ${!passe && e.type === 'match' ? `<button class="btn btn-sm btn-primary" data-convoq="${e.id}">${e.convoques.length ? 'Modifier la convocation' : 'Convoquer'}</button>` : ''}
        ${e.convoques.length || e.type === 'entrainement' ? `<button class="btn btn-sm" data-feuille="${e.id}">${e.type === 'entrainement' ? 'Feuille de présence' : 'Réponses'}</button>` : ''}
        ${passe && e.type === 'match' && !e.resultat ? `<button class="btn btn-sm btn-primary" data-score="${e.id}">Saisir le résultat</button>` : ''}
      </div>` : ''}
    </div>
    ${e.resultat ? `<div class="evt-score" style="color:${e.resultat.nous >= e.resultat.eux ? 'var(--good-text)' : 'var(--critical-text)'}">${e.resultat.nous}–${e.resultat.eux}</div>` : ''}
  </div>`;
}

function viewSportif() {
  const u = state.currentUser;
  const lic = monLicSportif();
  // Filtre par défaut : sa catégorie pour joueur/parent, M10 pour l'éducateur de démo
  if (subTabs.sportCat === '' && u.roleId === 'adherent' && lic) subTabs.sportCat = lic.cat;
  const cat = subTabs.sportCat;
  const onglet = subTabs.sportOnglet;
  let evts = state.events.filter(e => (!cat || e.cat === cat));
  evts = onglet === 'avenir' ? evts.filter(e => e.date >= TODAY) : evts.filter(e => e.date < TODAY).reverse();
  const ecrit = !window.canW || canW('sportif');
  return `
  <div class="page-head">
    <div><h1 class="page-title">Sportif</h1>
    <p class="page-sub">Calendrier, convocations et présences${lic && u.roleId === 'adherent' ? ' — ' + esc(lic.prenom + ' ' + lic.nom) + ' (' + esc(catLabel(lic.cat)) + ')' : ''}</p></div>
    ${ecrit ? `<div class="head-actions"><button class="btn btn-primary" id="btnNewEvt">+ Nouvel événement</button></div>` : ''}
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${onglet === 'avenir'}" class="${onglet === 'avenir' ? 'active' : ''}" data-sptab="avenir">À venir</button>
    <button role="tab" aria-selected="${onglet === 'passe'}" class="${onglet === 'passe' ? 'active' : ''}" data-sptab="passe">Résultats & passé</button>
  </div>
  <div class="toolbar">
    <select id="spCat" aria-label="Filtrer par catégorie">
      <option value="">Toutes les catégories</option>
      ${CATS_SPORT.map(c => `<option value="${c}" ${cat === c ? 'selected' : ''}>${esc(catLabel(c))}</option>`).join('')}
    </select>
    <span class="count-note">${evts.length} événement(s)</span>
  </div>
  <div class="evt-list">
    ${evts.length ? evts.map(e => evtCard(e)).join('') : '<div class="card"><p class="empty" style="padding:8px">Aucun événement.</p></div>'}
  </div>
  <p style="font-size:12.5px;color:var(--ink-2);max-width:780px">Dans la version réelle : notifications push aux convoqués, relance automatique des sans-réponse, import du calendrier fédéral, feuille de match FFR, covoiturage.</p>`;
}

function meProchainsEvts(lic) {
  const l = lic || monLicSportif();
  if (!l) return '<div class="card"><h3>Prochains événements</h3><p class="empty" style="padding:4px 0">Aucune licence rattachée.</p></div>';
  const evts = state.events.filter(e => e.cat === l.cat && e.date >= TODAY).slice(0, 2);
  return `<div class="card"><h3>Prochains événements</h3>
    ${evts.length ? evts.map(e => `<div class="alert-line" style="align-items:center">
      <span style="min-width:0"><strong>${esc(evtTitre(e))}</strong><br><span style="font-size:12px;color:var(--ink-2)">${dfrShort(e.date)} · ${e.heure}</span></span>
      <button class="btn btn-sm" style="margin-left:auto" data-goto-sportif="1">Répondre</button>
    </div>`).join('') : '<p class="empty" style="padding:4px 0">Rien de prévu.</p>'}</div>`;
}

/* ---- Documents en cases (joueur / coach) ---- */
function docsPersos() {
  const lic = monLicSportif();
  if (!lic) return [];
  const out = [
    { ico:'🩺', nom:'Certificat médical', meta: daysUntil(lic.certFin) < 0 ? 'Expiré' : 'Valide → ' + dfrShort(lic.certFin), alerte: daysUntil(lic.certFin) <= state.params.certJours },
    { ico:'🪪', nom:'Attestation de licence', meta: 'N° ' + lic.licence },
  ];
  if (lic.cotPaye > 0) out.push({ ico:'🧾', nom:'Reçu de cotisation', meta: eur(lic.cotPaye) + ' réglés' });
  return out;
}
function viewGedTiles() {
  const seeN = canSeeNode;
  const persos = docsPersos();
  const clubFiles = gedFindAll('').filter(x => x.n.type === 'file' && seeN(x.n));
  const estCoach = state.currentUser.roleId === 'educateur';
  // regrouper par dossier pour le coach, à plat pour le joueur
  const groupes = new Map();
  for (const { n, path } of clubFiles) {
    const g = path.length ? path[0].nom : 'Général';
    if (!groupes.has(g)) groupes.set(g, []);
    groupes.get(g).push({ n, path });
  }
  const tuile = ({ n, path }) => `<div class="tile" data-gedtile="${n.id}" role="button" tabindex="0">
    <span class="t-ico" aria-hidden="true">${GED_ICO[n.ext] || '📎'}</span>
    <span class="t-nom">${esc(n.nom.replace(/\.[a-z0-9]+$/i, ''))}</span>
    <span class="t-meta">${dfrShort(n.modif)}</span>
  </div>`;
  return `
  <div class="page-head">
    <div><h1 class="page-title">Documents</h1>
    <p class="page-sub">Mes documents et ceux partagés par le club</p></div>
  </div>
  ${persos.length ? `<div class="tile-section">Mes documents</div>
  <div class="tile-grid">
    ${persos.map((d, i) => `<div class="tile" data-perso="${i}" role="button" tabindex="0">
      <span class="t-ico" aria-hidden="true">${d.ico}</span>
      <span class="t-nom">${esc(d.nom)}${d.alerte ? ' <span class="badge b-crit" style="display:inline-flex;margin-top:3px"><span class="dot"></span>À renouveler</span>' : ''}</span>
      <span class="t-meta">${esc(d.meta)}</span>
    </div>`).join('')}
  </div>` : ''}
  ${estCoach
    ? [...groupes.entries()].map(([g, items]) => `<div class="tile-section">${esc(g)}</div><div class="tile-grid">${items.map(tuile).join('')}</div>`).join('')
    : `<div class="tile-section">Documents du club</div><div class="tile-grid">${clubFiles.map(tuile).join('')}</div>`}
  <p style="font-size:12.5px;color:var(--ink-2);margin-top:18px">Dans la version réelle : dépôt du certificat médical en photo depuis le téléphone, reçus téléchargeables, notifications quand le club partage un nouveau document.</p>`;
}

/* ---- Liaisons V4 ---- */
const _bindExtraV32 = bindExtra;
bindExtra = function (v) {
  _bindExtraV32(v);
  // Sportif
  $$('[data-sptab]', v).forEach(b => b.onclick = () => { subTabs.sportOnglet = b.dataset.sptab; render(); });
  const spCat = $('#spCat');
  if (spCat) spCat.onchange = e => { subTabs.sportCat = e.target.value; render(); };
  $$('[data-rsvp]', v).forEach(b => b.onclick = () => {
    const e = state.events.find(x => x.id === Number(b.dataset.evt));
    const lic = monLicSportif();
    if (!e || !lic) return;
    e.reponses[lic.id] = b.dataset.rsvp;
    if (e.type === 'entrainement' && !e.convoques.includes(lic.id)) e.convoques.push(lic.id);
    toast(b.dataset.rsvp === 'present' ? 'Présence confirmée — le coach est prévenu (simulé).' : 'Absence signalée — le coach est prévenu (simulé).');
    render();
  });
  $$('[data-goto-sportif]', v).forEach(b => b.onclick = () => { state.view = 'sportif'; render(); });
  const newEvt = $('#btnNewEvt');
  if (newEvt) newEvt.onclick = () => {
    openModal('Nouvel événement', `
      <div class="form-grid">
        <div class="field"><label for="neType">Type</label><select id="neType"><option value="match">Match</option><option value="entrainement">Entraînement</option><option value="tournoi">Tournoi</option></select></div>
        <div class="field"><label for="neCat">Catégorie</label><select id="neCat">${CATS_SPORT.map(c => `<option value="${c}">${esc(catLabel(c))}</option>`).join('')}</select></div>
        <div class="field"><label for="neDate">Date</label><input id="neDate" type="date" value="${addDaysIso(TODAY, 7)}"></div>
        <div class="field"><label for="neHeure">Heure</label><input id="neHeure" type="time" value="15:00"></div>
        <div class="field" style="grid-column:1/-1"><label for="neLieu">Lieu</label><input id="neLieu" value="${esc(LIEUX.dom)}"></div>
        <div class="field" style="grid-column:1/-1"><label for="neAdv">Adversaire / intitulé (matchs & tournois)</label><input id="neAdv" placeholder="ex. RC Montclar"></div>
      </div>`, `
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="neOk">Créer</button>`);
    $('#neOk').onclick = () => {
      const type = $('#neType').value;
      state.events.push(EVT(type, $('#neCat').value, $('#neDate').value, $('#neHeure').value, $('#neLieu').value.trim() || LIEUX.dom,
        type !== 'entrainement' ? { adversaire: $('#neAdv').value.trim() || 'À définir', domicile: true } : {}));
      state.events.sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));
      toast('Événement créé.'); closeModal(); render();
    };
  };
  $$('[data-convoq]', v).forEach(b => b.onclick = () => {
    const e = state.events.find(x => x.id === Number(b.dataset.convoq));
    if (!e) return;
    const pool = state.licencies.filter(l => l.cat === e.cat).sort((a, b2) => a.nom.localeCompare(b2.nom, 'fr'));
    openModal('Convocation — ' + evtTitre(e), `
      <p style="margin:0 0 10px;color:var(--ink-2);font-size:13px">${dfr(e.date)} à ${e.heure} · ${esc(e.lieu)}</p>
      <div class="presence-grid">
        ${pool.map(l => `<label><input type="checkbox" data-cv="${l.id}" ${e.convoques.includes(l.id) ? 'checked' : ''}> ${esc(l.prenom + ' ' + l.nom)}</label>`).join('')}
      </div>`, `
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="cvOk">Envoyer les convocations (simulé)</button>`);
    $('#cvOk').onclick = () => {
      const ids = $$('#modalRoot [data-cv]').filter(c => c.checked).map(c => Number(c.dataset.cv));
      e.convoques = ids;
      for (const id of ids) if (!e.reponses[id]) e.reponses[id] = '?';
      for (const k of Object.keys(e.reponses)) if (!ids.includes(Number(k))) delete e.reponses[k];
      toast(`${ids.length} convocation(s) envoyée(s) par notification (simulé).`);
      closeModal(); render();
    };
  });
  $$('[data-feuille]', v).forEach(b => b.onclick = () => {
    const e = state.events.find(x => x.id === Number(b.dataset.feuille));
    if (!e) return;
    const ecrit = !window.canW || canW('sportif');
    const pool = e.type === 'entrainement' ? state.licencies.filter(l => l.cat === e.cat) : state.licencies.filter(l => e.convoques.includes(l.id));
    const chip = r => r === 'present' ? '<span class="badge b-good"><span class="dot"></span>Présent</span>' : r === 'absent' ? '<span class="badge b-crit"><span class="dot"></span>Absent</span>' : '<span class="badge"><span class="dot"></span>Sans réponse</span>';
    openModal((e.type === 'entrainement' ? 'Présences — ' : 'Réponses — ') + evtTitre(e), `
      <p style="margin:0 0 10px;color:var(--ink-2);font-size:13px">${dfr(e.date)} à ${e.heure}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Licencié</th><th>Statut</th>${ecrit ? '<th>Pointer</th>' : ''}</tr></thead>
        <tbody>${pool.sort((a, b2) => a.nom.localeCompare(b2.nom, 'fr')).map(l => `<tr>
          <td>${esc(l.prenom + ' ' + l.nom)}</td>
          <td>${chip(e.reponses[l.id])}</td>
          ${ecrit ? `<td><button class="btn btn-sm" data-pt="${l.id}" data-val="present">P</button> <button class="btn btn-sm" data-pt="${l.id}" data-val="absent">A</button></td>` : ''}
        </tr>`).join('')}</tbody></table></div>`,
      `<button class="btn btn-primary" onclick="closeModal()">Fermer</button>`);
    $$('#modalRoot [data-pt]').forEach(p => p.onclick = () => {
      e.reponses[Number(p.dataset.pt)] = p.dataset.val;
      if (!e.convoques.includes(Number(p.dataset.pt))) e.convoques.push(Number(p.dataset.pt));
      closeModal(); render();
      toast('Pointage enregistré.');
    });
  });
  $$('[data-score]', v).forEach(b => b.onclick = () => {
    const e = state.events.find(x => x.id === Number(b.dataset.score));
    if (!e) return;
    openModal('Résultat — ' + evtTitre(e), `
      <div class="form-grid">
        <div class="field"><label for="scN">${esc(state.params.clubNom)}</label><input id="scN" type="number" min="0" value="0"></div>
        <div class="field"><label for="scE">${esc(e.adversaire)}</label><input id="scE" type="number" min="0" value="0"></div>
      </div>`, `
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="scOk">Enregistrer</button>`);
    $('#scOk').onclick = () => {
      e.resultat = { nous: Math.max(0, Number($('#scN').value) || 0), eux: Math.max(0, Number($('#scE').value) || 0) };
      toast('Résultat enregistré.'); closeModal(); render();
    };
  });
  // Documents en cases
  $$('[data-gedtile]', v).forEach(t => {
    const open = () => { const hit = gedFindAll('').find(x => x.n.id === Number(t.dataset.gedtile)); if (hit) gedOpenFile(hit.n, hit.path); };
    t.onclick = open;
    t.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
  $$('[data-perso]', v).forEach(t => {
    const open = () => {
      const d = docsPersos()[Number(t.dataset.perso)];
      if (!d) return;
      openModal(d.nom, `
        <p style="margin:0 0 12px;color:var(--ink-2)">${esc(d.meta)}</p>
        <div style="background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;padding:28px;text-align:center;color:var(--ink-3)">Aperçu du document (simulé)</div>`, `
        ${d.nom === 'Certificat médical' ? '<button class="btn" id="dpUp">📷 Déposer un nouveau certificat (simulé)</button>' : ''}
        <button class="btn" id="dpDl">Télécharger (simulé)</button>
        <button class="btn btn-primary" onclick="closeModal()">Fermer</button>`);
      $('#dpDl').onclick = () => toast('Téléchargement simulé.');
      const up = $('#dpUp');
      if (up) up.onclick = () => toast('Dans la version réelle : photo depuis le téléphone, transmise au secrétariat pour validation.');
    };
    t.onclick = open;
    t.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
};

render();
</script>
<style>
/* ---------- V5 ---------- */
.ftabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-strong); margin: 0 0 14px; overflow-x: auto; }
.ftabs button { border: 0; background: none; cursor: pointer; font: 600 12.5px/1 system-ui, sans-serif; color: var(--ink-2); padding: 9px 11px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.ftabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.stat-tile { background: var(--surface-2); border-radius: 10px; padding: 12px 10px; text-align: center; }
.stat-tile .v { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1; }
.stat-tile .l { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .5px; margin-top: 5px; }
.ean { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-2); }
</style>
<script>
/* ================= V5 : RETOURS TESTEUR — FICHE LICENCIÉ, STOCK+, BOUTIQUE, DOTATIONS, UTILISATEURS ================= */

/* ---- Enrichissement des licenciés ---- */
const CATS_MINEURS = ['M6','M8','M10','M12','M14','M16','M19'];
const METIERS = ['Infirmière','Artisan menuisier','Enseignant','Agricultrice','Commercial','Aide-soignante','Chauffeur routier','Comptable','Coiffeuse','Employé communal','Kinésithérapeute','Boulanger'];
const CLUBS_VOISINS = ['RC Montclar','US Rochebrune','Entente Villeneuve','Stade Pontétois','Ovalie Serrane'];
const TAILLES_MIN = ['6 ans','8 ans','10 ans','12 ans','14 ans','XS'];
const TAILLES_MAJ = ['S','M','L','XL','XXL'];
(function enrichirLicencies() {
  for (const l of state.licencies) {
    const mineur = CATS_MINEURS.includes(l.cat);
    const age = 2026 - Number(l.naissance.slice(0, 4));
    l.nationalite = rnd() < 0.88 ? 'Française' : pick(['Italienne','Portugaise','Britannique','Fidjienne','Géorgienne']);
    l.paysNaissance = l.nationalite === 'Française' ? 'France' : pick(['France', { Italienne:'Italie', Portugaise:'Portugal', Britannique:'Royaume-Uni', Fidjienne:'Fidji', 'Géorgienne':'Géorgie' }[l.nationalite]]);
    l.villeNaissance = pick([...VILLES, 'Toulouse', 'Clermont-Ferrand', 'Pau', 'Lyon']);
    l.dejaLicencie = l.inscrit < 2026 || rnd() < 0.3;
    l.anneesLicence = l.dejaLicencie ? Math.max(1, 2026 - l.inscrit + (rnd() < 0.3 ? ri(1, 4) : 0)) : 0;
    l.ancienClub = l.dejaLicencie ? (l.inscrit < 2026 ? state.params.clubNom : pick(CLUBS_VOISINS)) : null;
    l.mutation = !!(l.dejaLicencie && l.ancienClub && l.ancienClub !== state.params.clubNom);
    l.pointure = mineur ? ri(30, 41) : ri(39, 47);
    l.tailleCm = mineur ? 100 + Math.min(85, age * 6) + ri(-6, 6) : ri(165, 196);
    l.poids = mineur ? Math.max(18, Math.round(l.tailleCm / 2.6) + ri(-4, 8)) : ri(68, 118);
    l.tailleShort = mineur && age < 15 ? pick(TAILLES_MIN) : pick(TAILLES_MAJ);
    l.tailleMaillot = mineur && age < 15 ? pick(TAILLES_MIN) : pick(TAILLES_MAJ);
    // Stats sportives (saison passée) — pas pour les dirigeants
    l.stats = l.cat === 'DIR' ? null : {
      saison: '2025-2026',
      matchs: l.dejaLicencie ? ri(4, l.cat === 'SEN' ? 22 : 14) : 0,
      essais: l.dejaLicencie ? ri(0, 9) : 0,
      cartonsJ: l.dejaLicencie && rnd() < 0.3 ? ri(1, 3) : 0,
      cartonsR: l.dejaLicencie && rnd() < 0.05 ? 1 : 0,
    };
    // Documents de la fiche
    l.docsLic = [{ nom: `Certificat médical ${l.nom} ${l.certFin.slice(0,4)}.pdf`, type: 'Certificat médical', date: addDaysIso(l.certFin, -1095) }];
    if (mineur && rnd() < 0.5) l.docsLic.push({ nom: `Autorisation parentale.pdf`, type: 'Autorisation', date: addDaysIso(TODAY, -ri(10, 80)) });
    // Responsables légaux (mineurs)
    if (mineur) {
      const n = rnd() < 0.7 ? 2 : 1;
      l.referents = [];
      for (let i = 0; i < n; i++) {
        const estMere = i === 0 ? rnd() < 0.5 : l.referents[0].lien === 'Père';
        const prenom = estMere ? pick(PRENOMS_F) : pick(PRENOMS_M);
        l.referents.push({
          prenom, nom: rnd() < 0.85 ? l.nom : pick(NOMS),
          lien: estMere ? 'Mère' : 'Père',
          email: `${prenom.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')}.${l.nom.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')}@exemple.fr`,
          tel: `06 ${ri(10,99)} ${ri(10,99)} ${ri(10,99)} ${ri(10,99)}`,
          metier: pick(METIERS),
        });
      }
      l.prefMail = n === 1 ? 'Référent 1' : pick(['Référent 1', 'Référent 2', 'Les deux', 'Les deux']);
      l.prefWhatsapp = n === 1 ? 'Référent 1' : pick(['Référent 1', 'Référent 2', 'Les deux']);
      l.familleAutres = rnd() < 0.3 ? pick(['Oui — un frère en M8', 'Oui — une sœur en M12', 'Oui — le père en rugby loisir', 'Oui — deux frères (M10 et M14)']) : 'Non';
    } else l.referents = null;
    // Paiement : mode + échéancier
    l.modePaiement = l.cot === 0 ? '—' : pick(['CB en ligne','CB en ligne','Virement','Chèque','Chèque (×3)','Espèces','Chèques vacances (ANCV)']);
    l.echeances = [];
    if (l.cot > 0) {
      if (l.cotStatut === 'payee') l.echeances.push({ date: addDaysIso(TODAY, -ri(5, 40)), montant: l.cot, statut: 'reglee' });
      else if (l.cotStatut === 'partielle') {
        l.echeances.push({ date: addDaysIso(TODAY, -ri(10, 40)), montant: l.cotPaye, statut: 'reglee' });
        l.echeances.push({ date: addDaysIso(TODAY, ri(10, 45)), montant: l.cot - l.cotPaye, statut: 'a_venir' });
      } else l.echeances.push({ date: addDaysIso(TODAY, -ri(1, 20)), montant: l.cot, statut: 'en_retard' });
    }
    l.dotations = l.dotations || [];
  }
})();

/* ---- Enrichissement du stock : prix, EAN, articles boutique & dotation ---- */
(function enrichirStock() {
  const prix = { 'Ballons T3': [18, null], 'Ballons T4': [22, null], 'Ballons T5': [28, null], 'Plots': [1.5, null], 'Boucliers': [45, null], 'Sacs de plaquage': [65, null], 'Chasubles': [30, null], 'Maillots match': [520, null], 'Protège-dents': [3, 5], 'Bombes de froid': [4.5, null], 'Strap': [3.8, null], 'Compresses': [2.5, null], 'Solution antiseptique': [4, null], 'Poches de glace': [1.2, null], 'Couvertures': [2.5, null], 'Gants nitrile': [6, null], 'Sutures': [5, null], 'Ramettes': [5, null], 'Cartouches': [38, null], 'Enveloppes': [0.08, null], 'Licences vierges': [0.5, null], 'Café': [9, null], 'Gobelets': [0.9, 1], 'Fûts': [95, null], 'Sodas': [0.45, 1.5], 'Saucisses': [7.5, null] };
  for (const a of state.stock) {
    const k = Object.keys(prix).find(p => a.nom.startsWith(p.split(' ')[0]) && a.nom.includes(p.split(' ')[1] || ''));
    const [pa, pv] = k ? prix[k] : [ri(2, 30), null];
    a.prixAchat = a.prixAchat ?? pa;
    a.prixVente = a.prixVente ?? pv;
    a.ean = a.ean || '3' + String(ri(100000000000, 999999999999));
    a.vente = !!a.prixVente;
    a.dotation = false;
  }
  const addArt = (pole, nom, qte, seuil, unite, empl, pa, pv, opts = {}) => {
    state.stock.push({ id: Date.now() + ri(1, 99999), pole, nom, qte, seuil, unite, empl, peremption: null, prixAchat: pa, prixVente: pv, ean: '3' + String(ri(100000000000, 999999999999)), vente: !!pv, dotation: !!opts.dot });
  };
  addArt('sportif', 'Chaussettes club (paire)', 64, 30, 'u.', 'Local matériel', 3.2, 8, { dot: true });
  addArt('sportif', 'Short club', 41, 20, 'u.', 'Local matériel', 7.5, 18, { dot: true });
  addArt('sportif', 'Maillot d\'entraînement club', 38, 20, 'u.', 'Local matériel', 9, 22, { dot: true });
  addArt('sportif', 'Maillot réplique supporter', 22, 10, 'u.', 'Buvette', 21, 45);
  addArt('sportif', 'Écharpe du club', 17, 10, 'u.', 'Buvette', 5.5, 15);
  addArt('sportif', 'Bonnet du club', 12, 8, 'u.', 'Buvette', 4, 12);
})();
state.ventes = [];
state.dotationsLog = [];
// Quelques dotations et ventes passées pour peupler les écrans
(function seedVentesDotations() {
  const arts = state.stock.filter(a => a.dotation);
  for (const l of state.licencies.filter(x => x.cat === 'SEN').slice(0, 8)) {
    const a = pick(arts);
    const d = addDaysIso(TODAY, -ri(3, 15));
    l.dotations.push({ article: a.nom, qte: 1, date: d });
    state.dotationsLog.push({ id: Date.now() + ri(1, 9999), licId: l.id, article: a.nom, qte: 1, date: d, par: 'P. Gayraud' });
  }
  const merch = state.stock.filter(a => a.vente && a.pole === 'sportif');
  for (let i = 0; i < 5; i++) {
    const a = pick(merch);
    state.ventes.push({ id: Date.now() + ri(1, 9999), article: a.nom, qte: ri(1, 2), pu: a.prixVente, date: addDaysIso(TODAY, -ri(1, 12)), mode: pick(['CB','Espèces','CB','Chèque']), acheteur: pick(['Supporter','Famille adhérent','Adhérent']) });
  }
  state.dotationsLog.sort((a, b) => b.date.localeCompare(a.date));
  state.ventes.sort((a, b) => b.date.localeCompare(a.date));
})();

/* ---- Fiche licencié en onglets ---- */
subTabs.fiche = 'general';
openFicheLic = function (id) { subTabs.fiche = 'general'; renderFiche(id); };

function renderFiche(id, tab) {
  if (tab) subTabs.fiche = tab;
  const l = state.licencies.find(x => x.id === id);
  if (!l) return;
  const t = subTabs.fiche;
  const tabs = [
    ['general', 'Général'],
    ...(l.referents ? [['responsable', 'Responsable légal']] : []),
    ...(l.stats ? [['rugby', 'Rugby']] : []),
    ['documents', `Documents (${l.docsLic.length})`],
    ['paiement', 'Paiement'],
    ['dotation', `Dotation (${l.dotations.length})`],
  ];
  const G = (lab, val) => `<div><label>${lab}</label>${val}</div>`;
  let body = '';
  if (t === 'general') body = `<div class="form-grid">
    ${G('Catégorie', esc(catLabel(l.cat)))}
    ${G('Sexe', l.sexe === 'F' ? 'Féminin' : 'Masculin')}
    ${G('Né(e) le', dfr(l.naissance) + ' — ' + esc(l.villeNaissance) + ' (' + esc(l.paysNaissance) + ')')}
    ${G('Nationalité', esc(l.nationalite))}
    ${G('Licence FFR', l.licence + ' — ' + licBadge(l.licStatut))}
    ${G('Certificat', certBadge(l))}
    ${G('Licencié précédemment', (l.dejaLicencie ? `Oui — ${l.anneesLicence} saison(s), ${esc(l.ancienClub)}` : 'Non (première licence)') + (l.mutation ? ` <span class="badge b-warn"><span class="dot"></span>Mutation FFR${l.licStatut === 'attente' ? ' — dossier en cours' : l.licStatut === 'validee' ? ' — effectuée' : ''}</span>` : ''))}
    ${G('Commune', esc(l.ville))}
    ${l.referents ? '' : G('Email', esc(l.email)) + G('Téléphone', esc(l.tel))}
    ${G('Taille / poids', l.tailleCm + ' cm · ' + l.poids + ' kg')}
    ${G('Pointure (chaussettes)', l.pointure)}
    ${G('Taille short', esc(l.tailleShort))}
    ${G('Taille maillot d\'entraînement', esc(l.tailleMaillot))}
    ${G('Au club depuis', l.inscrit)}
  </div>`;
  else if (t === 'responsable') body = `
    ${l.referents.map((r, i) => `<div class="card" style="box-shadow:none;margin-bottom:12px">
      <h3>Référent ${i + 1} — ${esc(r.lien)}</h3>
      <div class="form-grid">
        ${G('Nom', esc(r.prenom + ' ' + r.nom))}
        ${G('Métier', esc(r.metier))}
        ${G('Email', esc(r.email))}
        ${G('Téléphone', esc(r.tel))}
      </div>
    </div>`).join('')}
    <div class="form-grid">
      ${G('Autres membres de la famille licenciés en 2026-2027', esc(l.familleAutres))}
      ${G('Contact email du parent dirigeant', esc(l.prefMail))}
      ${G('Contact WhatsApp du parent dirigeant', esc(l.prefWhatsapp))}
    </div>`;
  else if (t === 'rugby') body = `
    <p style="margin:0 0 10px;font-size:12.5px;color:var(--ink-2)">Saison ${l.stats.saison} — dans la version réelle : matchs joués dérivés automatiquement des feuilles de match du module Sportif ; essais et cartons complétés par le coach à la saisie du résultat.</p>
    <div class="stat-tiles">
      <div class="stat-tile"><div class="v">${l.stats.matchs}</div><div class="l">Matchs joués</div></div>
      <div class="stat-tile"><div class="v">${l.stats.essais}</div><div class="l">Essais</div></div>
      <div class="stat-tile"><div class="v" style="color:${l.stats.cartonsJ ? 'var(--warning-text)' : 'inherit'}">${l.stats.cartonsJ}</div><div class="l">Cartons jaunes</div></div>
      <div class="stat-tile"><div class="v" style="color:${l.stats.cartonsR ? 'var(--critical-text)' : 'inherit'}">${l.stats.cartonsR}</div><div class="l">Cartons rouges</div></div>
    </div>`;
  else if (t === 'documents') {
    body = `
    ${daysUntil(l.certFin) < 0 ? '<p style="margin:0 0 10px"><span class="badge b-crit"><span class="dot"></span>Certificat médical (fiche de soin) expiré — licence bloquée tant qu\'il n\'est pas redéposé</span></p>' : ''}
    <div class="table-wrap"><table>
      <thead><tr><th>Document</th><th>Type</th><th>Déposé le</th><th></th></tr></thead>
      <tbody>${l.docsLic.map((d, i) => `<tr>
        <td>📄 ${esc(d.nom)}</td><td><span class="badge">${esc(d.type)}</span></td><td style="white-space:nowrap">${dfrShort(d.date)}</td>
        <td style="white-space:nowrap"><button class="btn btn-sm" data-fdocren="${i}">Renommer</button> <button class="btn btn-sm" data-fdocdl="${i}">⬇</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div style="margin-top:12px"><button class="btn btn-sm" id="fdocAdd">+ Déposer un document (simulé)</button></div>`;
  }
  else if (t === 'paiement') {
    const pays = state.paiements.filter(p => p.licId === l.id);
    const echBadge = s => s === 'reglee' ? '<span class="badge b-good"><span class="dot"></span>Réglée</span>' : s === 'a_venir' ? '<span class="badge"><span class="dot"></span>À venir</span>' : '<span class="badge b-crit"><span class="dot"></span>En retard</span>';
    body = `
    <div class="form-grid" style="margin-bottom:12px">
      ${G('État de la licence', licBadge(l.licStatut))}
      ${G('Cotisation', cotBadge(l.cotStatut))}
      ${G('Montant réglé', l.cot ? `${eur(l.cotPaye)} sur ${eur(l.cot)}` : 'Exonéré')}
      ${G('Mode de paiement', esc(l.modePaiement))}
    </div>
    ${l.echeances.length ? `<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);margin:0 0 8px">Échéancier</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Échéance</th><th class="num">Montant</th><th>Statut</th></tr></thead>
      <tbody>${l.echeances.map(e => `<tr><td>${dfrShort(e.date)}</td><td class="num">${eur(e.montant)}</td><td>${echBadge(e.statut)}</td></tr>`).join('')}</tbody>
    </table></div>` : ''}
    ${pays.length ? `<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);margin:14px 0 8px">Demandes de paiement en ligne</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Objet</th><th>Créée</th><th>Statut</th><th class="num">Montant</th></tr></thead>
      <tbody>${pays.map(p => `<tr><td>${esc(p.objet)}</td><td>${dfrShort(p.creee)}</td>
        <td>${p.statut === 'paye' ? '<span class="badge b-good"><span class="dot"></span>Payé le ' + dfrShort(p.payee) + '</span>' : p.statut === 'relancee' ? '<span class="badge b-serious"><span class="dot"></span>Relancé ×' + p.relances + '</span>' : '<span class="badge b-warn"><span class="dot"></span>Lien envoyé</span>'}</td>
        <td class="num">${eur(p.montant)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  }
  else if (t === 'dotation') body = `
    ${l.dotations.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Article reçu</th><th class="num">Qté</th><th>Date</th></tr></thead>
      <tbody>${l.dotations.map(d => `<tr><td>🎽 ${esc(d.article)}</td><td class="num">${d.qte}</td><td>${dfrShort(d.date)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="empty" style="padding:6px 0">Aucune dotation reçue du club.</p>'}
    ${(!window.canW || canW('stock')) ? `<div style="margin-top:12px"><button class="btn btn-sm" id="fdotAdd">+ Attribuer une dotation</button></div>` : ''}
    <p style="font-size:12px;color:var(--ink-3);margin:12px 0 0">La dotation décrémente le stock du pôle sportif (tailles issues de la fiche : short ${esc(l.tailleShort)}, maillot ${esc(l.tailleMaillot)}, pointure ${l.pointure}).</p>`;

  openModal(`${l.prenom} ${l.nom}`, `
    <div class="ftabs">${tabs.map(([id2, lab]) => `<button class="${t === id2 ? 'active' : ''}" data-ftab="${id2}">${lab}</button>`).join('')}</div>
    ${body}`, `
    ${l.cotStatut !== 'payee' && l.cot && (!window.canW || canW('licencies')) ? `<button class="btn" id="ficheLien">Envoyer un lien de paiement</button>` : ''}
    ${(!window.canW || canW('licencies')) ? `<button class="btn" id="ficheEdit">Modifier</button>` : ''}
    <button class="btn btn-primary" onclick="closeModal()">Fermer</button>`);
  $$('#modalRoot [data-ftab]').forEach(b => b.onclick = () => renderFiche(id, b.dataset.ftab));
  const lien = $('#ficheLien');
  if (lien) lien.onclick = () => { creerDemandePaiement(l); closeModal(); render(); };
  const edit = $('#ficheEdit');
  if (edit) edit.onclick = () => openFormLic(l.id);
  $$('#modalRoot [data-fdocren]').forEach(b => b.onclick = () => {
    const d = l.docsLic[Number(b.dataset.fdocren)];
    openModal('Renommer le document', `<div class="field"><label for="rnNom">Nouveau nom</label><input id="rnNom" value="${esc(d.nom)}" style="width:100%"></div>`,
      `<button class="btn" id="rnBack">Annuler</button><button class="btn btn-primary" id="rnOk">Renommer</button>`);
    $('#rnBack').onclick = () => renderFiche(id, 'documents');
    $('#rnOk').onclick = () => { d.nom = $('#rnNom').value.trim() || d.nom; toast('Document renommé.'); renderFiche(id, 'documents'); };
  });
  $$('#modalRoot [data-fdocdl]').forEach(b => b.onclick = () => toast('Téléchargement simulé.'));
  const da = $('#fdocAdd');
  if (da) da.onclick = () => { l.docsLic.push({ nom: 'Nouveau document.pdf', type: 'Autre', date: TODAY }); toast('Document déposé (simulé) — renomme-le.'); renderFiche(id, 'documents'); };
  const dot = $('#fdotAdd');
  if (dot) dot.onclick = () => openDotation(l.id, () => renderFiche(id, 'dotation'));
}

/* ---- Boutique ---- */
function stockTabsHtml(active) {
  return `<div class="tabs" role="tablist">
    <button role="tab" aria-selected="false" data-pole="tous">Tous les pôles</button>
    ${POLES.map(p => `<button role="tab" aria-selected="false" data-pole="${p.code}">${p.label}</button>`).join('')}
    <button role="tab" aria-selected="${active === 'boutique'}" class="${active === 'boutique' ? 'active' : ''}" data-pole="boutique">🛒 Boutique</button>
    <button role="tab" aria-selected="${active === 'dotations'}" class="${active === 'dotations' ? 'active' : ''}" data-pole="dotations">🎽 Dotations</button>
  </div>`;
}
function viewBoutique() {
  const arts = state.stock.filter(a => a.vente).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  const caMois = state.ventes.reduce((s, v) => s + v.qte * v.pu, 0);
  return `
  <div class="page-head">
    <div><h1 class="page-title">Stock</h1>
    <p class="page-sub">Boutique du club — ${eur(caMois)} de ventes récentes, reversées en recettes « Boutique »</p></div>
  </div>
  ${stockTabsHtml('boutique')}
  <div class="grid two-col" style="margin-top:14px">
    <div class="card" style="padding:4px 8px">
      <div class="table-wrap"><table>
        <thead><tr><th>Article</th><th class="num">Prix de vente</th><th class="num">En stock</th><th></th></tr></thead>
        <tbody>${arts.map(a => `<tr>
          <td><strong>${esc(a.nom)}</strong><br><span class="ean">${a.ean}</span></td>
          <td class="num" style="font-weight:600">${eur(a.prixVente)}</td>
          <td class="num">${a.qte}</td>
          <td><button class="btn btn-sm btn-primary" data-vendre="${a.id}" ${a.qte <= 0 ? 'disabled' : ''}>Vendre</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card" style="padding:4px 8px">
      <div style="padding:10px 8px 0"><h3 style="margin:0 0 6px">Dernières ventes</h3></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Date</th><th>Article</th><th class="num">Qté</th><th class="num">Total</th><th>Mode</th></tr></thead>
        <tbody>${state.ventes.length ? state.ventes.slice(0, 12).map(v => `<tr>
          <td style="white-space:nowrap">${dfrShort(v.date)}</td><td>${esc(v.article)}</td>
          <td class="num">${v.qte}</td><td class="num" style="font-weight:600">${eur(v.qte * v.pu)}</td><td>${esc(v.mode)}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="empty">Aucune vente.</td></tr>'}</tbody>
      </table></div>
    </div>
  </div>
  <p style="font-size:12.5px;color:var(--ink-2)">Chaque vente décrémente le stock et crée l'écriture comptable « Boutique ». Dans la version réelle : scan EAN, caisse tablette les jours de match, paiement CB via le module de paiement.</p>`;
}

/* ---- Dotations ---- */
function viewDotations() {
  const nomLic = id => { const l = state.licencies.find(x => x.id === id); return l ? l.prenom + ' ' + l.nom : '—'; };
  return `
  <div class="page-head">
    <div><h1 class="page-title">Stock</h1>
    <p class="page-sub">Dotations — équipement remis aux joueurs par le club</p></div>
    <div class="head-actions"><button class="btn btn-primary" id="btnNewDot">+ Nouvelle dotation</button></div>
  </div>
  ${stockTabsHtml('dotations')}
  <div class="card" style="padding:4px 8px;margin-top:14px">
    <div class="table-wrap"><table>
      <thead><tr><th>Joueur</th><th>Article</th><th class="num">Qté</th><th>Date</th><th>Remis par</th></tr></thead>
      <tbody>${state.dotationsLog.length ? state.dotationsLog.map(d => `<tr>
        <td><strong>${esc(nomLic(d.licId))}</strong></td><td>🎽 ${esc(d.article)}</td>
        <td class="num">${d.qte}</td><td style="white-space:nowrap">${dfrShort(d.date)}</td><td style="color:var(--ink-2)">${esc(d.par)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty">Aucune dotation enregistrée.</td></tr>'}</tbody>
    </table></div>
  </div>
  <p style="font-size:12.5px;color:var(--ink-2)">La dotation apparaît aussi dans l'onglet « Dotation » de la fiche du licencié. Les tailles (short, maillot, pointure) viennent de sa fiche.</p>`;
}

function openDotation(licId, onDone) {
  const arts = state.stock.filter(a => a.dotation && a.qte > 0);
  const lics = [...state.licencies].sort((a, b) => (a.nom + a.prenom).localeCompare(b.nom + b.prenom, 'fr'));
  openModal('Nouvelle dotation', `
    <div class="form-grid">
      <div class="field"><label for="dtLic">Joueur</label><select id="dtLic">
        ${lics.map(l => `<option value="${l.id}" ${licId === l.id ? 'selected' : ''}>${esc(l.nom.toUpperCase() + ' ' + l.prenom)} — ${esc(catLabel(l.cat))}</option>`).join('')}</select></div>
      <div class="field"><label for="dtArt">Article</label><select id="dtArt">
        ${arts.map(a => `<option value="${a.id}">${esc(a.nom)} (${a.qte} en stock)</option>`).join('')}</select></div>
      <div class="field"><label for="dtQte">Quantité</label><input id="dtQte" type="number" min="1" value="1"></div>
    </div>`, `
    <button class="btn" onclick="closeModal()">Annuler</button>
    <button class="btn btn-primary" id="dtOk">Attribuer</button>`);
  $('#dtOk').onclick = () => {
    const l = state.licencies.find(x => x.id === Number($('#dtLic').value));
    const a = state.stock.find(x => x.id === Number($('#dtArt').value));
    const q = Math.max(1, Number($('#dtQte').value) || 1);
    if (!l || !a) return;
    if (a.qte < q) { toast('Stock insuffisant.'); return; }
    a.qte -= q;
    l.dotations.push({ article: a.nom, qte: q, date: TODAY });
    state.dotationsLog.unshift({ id: Date.now(), licId: l.id, article: a.nom, qte: q, date: TODAY, par: state.currentUser.nom });
    state.mouvements.unshift({ id: Date.now() + 1, date: TODAY, artId: a.id, delta: -q, motif: 'Dotation joueur', par: state.currentUser.nom });
    toast(`${q} × ${a.nom} attribué(s) à ${l.prenom} ${l.nom}.`);
    if (onDone) onDone(); else { closeModal(); render(); }
  };
}

/* ---- Fiche article ---- */
function openFicheArticle(id) {
  const a = state.stock.find(x => x.id === id);
  if (!a) return;
  const mvts = state.mouvements.filter(m => m.artId === id).slice(0, 6);
  const marge = a.prixVente ? Math.round((a.prixVente - a.prixAchat) * 100) / 100 : null;
  openModal(a.nom, `
    <div class="form-grid" style="margin-bottom:12px">
      <div><label>Pôle</label>${esc((POLES.find(p => p.code === a.pole) || {}).label || a.pole)}</div>
      <div><label>Stock / seuil</label>${a.qte} ${esc(a.unite)} · seuil ${a.seuil}</div>
      <div><label>Prix d'achat</label>${eur(a.prixAchat)}</div>
      <div><label>Prix de vente</label>${a.prixVente ? `${eur(a.prixVente)} <span style="color:var(--good-text);font-size:12px">(marge ${eur(marge)})</span>` : '— (non vendu)'}</div>
      <div><label>EAN</label><span class="ean">${a.ean}</span></div>
      <div><label>Emplacement</label>${esc(a.empl)}</div>
      ${a.peremption ? `<div><label>Péremption</label>${dfrShort(a.peremption)}</div>` : ''}
      <div><label>Statuts</label>${a.vente ? '<span class="badge b-info">Vendu en boutique</span> ' : ''}${a.dotation ? '<span class="badge b-good">Article de dotation</span>' : ''}</div>
    </div>
    ${mvts.length ? `<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-2);margin:0 0 8px">Derniers mouvements</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th class="num">Δ</th><th>Motif</th><th>Par</th></tr></thead>
      <tbody>${mvts.map(m => `<tr><td>${dfrShort(m.date)}</td>
        <td class="num" style="font-weight:600;color:${m.delta >= 0 ? 'var(--good-text)' : 'var(--critical-text)'}">${m.delta >= 0 ? '+' : ''}${m.delta}</td>
        <td>${esc(m.motif)}</td><td style="color:var(--ink-2)">${esc(m.par)}</td></tr>`).join('')}</tbody>
    </table></div>` : ''}`,
    `<button class="btn btn-primary" onclick="closeModal()">Fermer</button>`);
}

/* ---- Paramètres : utilisateurs (back-office des droits) ---- */
function paramUtilisateurs() {
  return `
  <div class="toolbar" style="margin-top:2px">
    <button class="btn btn-primary" id="pInviter">+ Inviter un utilisateur</button>
    <span class="count-note">${PERSONAS.length} comptes actifs (démo)</span>
  </div>
  <div class="card" style="padding:4px 8px">
    <div class="table-wrap"><table>
      <thead><tr><th>Utilisateur</th><th>Email</th><th>Rôle</th><th>Statut</th></tr></thead>
      <tbody>${PERSONAS.map(p => `<tr>
        <td><strong>${esc(p.nom)}</strong>${p.id === state.currentUser.id ? ' <span class="badge b-info">vous</span>' : ''}</td>
        <td style="color:var(--ink-2)">${esc(p.nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, '').trim().replace(/ +/g, '.'))}@exemple.fr</td>
        <td><select data-urole="${p.id}">${ROLES.map(r => `<option value="${r.id}" ${p.roleId === r.id ? 'selected' : ''}>${r.label}</option>`).join('')}</select></td>
        <td><span class="badge b-good"><span class="dot"></span>Actif</span></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>
  <p style="font-size:12.5px;color:var(--ink-2)">Le rôle attribué ici détermine ce que la personne voit et peut faire (matrice de l'onglet « Droits & rôles »). Dans la version réelle : invitation par email avec rôle pré-affecté, validation des demandes d'adhésion entrantes, désactivation d'un compte.</p>`;
}

/* ---- Liaisons V5 ---- */
const _bindExtraV4 = bindExtra;
bindExtra = function (v) {
  _bindExtraV4(v);
  $$('[data-artfiche]', v).forEach(tr => {
    tr.onclick = e => { if (e.target.closest('button')) return; openFicheArticle(Number(tr.dataset.artfiche)); };
    tr.onkeydown = e => { if (e.key === 'Enter' && !e.target.closest('button')) openFicheArticle(Number(tr.dataset.artfiche)); };
  });
  $$('[data-vendre]', v).forEach(b => b.onclick = () => {
    const a = state.stock.find(x => x.id === Number(b.dataset.vendre));
    if (!a) return;
    openModal('Vente — ' + a.nom, `
      <div class="form-grid">
        <div class="field"><label for="vtQte">Quantité</label><input id="vtQte" type="number" min="1" max="${a.qte}" value="1"></div>
        <div class="field"><label for="vtMode">Mode de paiement</label><select id="vtMode"><option>CB</option><option>Espèces</option><option>Chèque</option><option>Lien de paiement</option></select></div>
        <div class="field" style="grid-column:1/-1"><label for="vtQui">Acheteur (optionnel)</label><input id="vtQui" placeholder="ex. Famille Robin"></div>
      </div>
      <p style="font-size:13px;margin:12px 0 0">Total : <strong id="vtTotal">${eur(a.prixVente)}</strong></p>`, `
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="vtOk">Encaisser</button>`);
    $('#vtQte').oninput = () => { $('#vtTotal').textContent = eur((Number($('#vtQte').value) || 1) * a.prixVente); };
    $('#vtOk').onclick = () => {
      const q = Math.min(a.qte, Math.max(1, Number($('#vtQte').value) || 1));
      a.qte -= q;
      const total = q * a.prixVente;
      state.ventes.unshift({ id: Date.now(), article: a.nom, qte: q, pu: a.prixVente, date: TODAY, mode: $('#vtMode').value, acheteur: $('#vtQui').value.trim() || 'Comptoir' });
      state.mouvements.unshift({ id: Date.now() + 1, date: TODAY, artId: a.id, delta: -q, motif: 'Vente boutique', par: state.currentUser.nom });
      state.ecritures.unshift({ id: Date.now() + 2, date: TODAY, sens: 'R', cat: 'Boutique', libelle: `Vente boutique — ${q} × ${a.nom}`, montant: total });
      toast(`Vente encaissée : ${eur(total)} — stock et comptabilité mis à jour.`);
      closeModal(); render();
    };
  });
  const nd = $('#btnNewDot');
  if (nd) nd.onclick = () => openDotation(null, null);
  const inv = $('#pInviter');
  if (inv) inv.onclick = () => toast('Dans la version réelle : email d\'invitation avec rôle pré-affecté (chantier comptes utilisateurs).');
  $$('[data-urole]', v).forEach(s => s.onchange = () => {
    const p = PERSONAS.find(x => x.id === s.dataset.urole);
    if (p) { p.roleId = s.value; p.roleLabel = (ROLES.find(r => r.id === s.value) || {}).label || p.roleLabel; toast(`Rôle de ${p.nom} mis à jour — visible via « voir comme ».`); render(); }
  });
};

render();
</script>
